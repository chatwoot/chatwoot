# =============================================================================
# SOLO PREVIEW DE STAGING — imagen GHCR (último push a develop)
# =============================================================================
# NO usar para desarrollo diario: NO refleja cambios locales sin push.
#
# Para desarrollo con TU código en disco usar:
#   docker compose -f docker-compose.dokploy.yml -f docker-compose.dokploy.fork.yml up -d --build
#
# Este archivo (local.yml) sirve para probar lo mismo que staging sin rebuild:
#   docker compose -f docker-compose.dokploy.yml -f docker-compose.local.yml pull
#   docker compose -f docker-compose.dokploy.yml -f docker-compose.local.yml up -d
# =============================================================================

x-fork-image: &fork-image
  image: ghcr.io/pabloluna3596afk/chatwoot:develop
  pull_policy: always

services:
  chatwoot-rails:
    <<: *fork-image
    networks:
      - chatwoot-internal
      - main-chatwoot-local

  chatwoot-sidekiq:
    <<: *fork-image
    networks:
      - chatwoot-internal
      - main-chatwoot-local

  chatwoot-postgres:
    networks:
      - chatwoot-internal
      - main-chatwoot-local
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  chatwoot-redis:
    networks:
      - chatwoot-internal

  # Página estática para probar el widget: http://localhost:8080/test-chat.html
  widget-test:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./test-chat.html:/usr/share/nginx/html/test-chat.html:ro
      - ./docker/widget-test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  main-chatwoot-local:
    external: true
