# Production stack for QEVA CRM (Portainer / Docker Swarm).
#
# All sensitive values live in ONE Swarm secret named `qeva_env`, created in Portainer
# (Secrets → Add secret). Its content is a dotenv file: one KEY="value" per line.
# It is mounted at /run/secrets/qeva_env and sourced before the app starts.
#
# Non-sensitive settings are below in x-app-env. QEVA_IMAGE and QEVA_DOMAIN are stack variables.

x-app-env: &app-env
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  INSTALLATION_NAME: QEVA CRM
  FRONTEND_URL: https://${QEVA_DOMAIN:-crm.qeva.xyz}
  DEFAULT_LOCALE: es
  FORCE_SSL: "true"
  ENABLE_ACCOUNT_SIGNUP: "false"
  ACTIVE_STORAGE_SERVICE: local
  RAILS_LOG_TO_STDOUT: "true"
  USE_INBOX_AVATAR_FOR_BOT: "true"

services:
  qeva_app:
    image: ${QEVA_IMAGE:?set QEVA_IMAGE to the image published in the registry}
    command:
      - sh
      - -c
      - set -a; . /run/secrets/qeva_env; set +a; exec docker/entrypoints/rails.sh bundle exec rails s -p 3000 -b 0.0.0.0
    secrets:
      - qeva_env
    volumes:
      - qeva_storage:/app/storage
    networks:
      - network_public
    environment:
      <<: *app-env

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s

      placement:
        constraints:
          - node.role == manager

      # 512M was too tight for Rails on this server; the upstream stack restarted under load.
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public

        - traefik.http.routers.qeva_app.rule=Host(`${QEVA_DOMAIN:-crm.qeva.xyz}`)
        - traefik.http.routers.qeva_app.service=qeva_app
        - traefik.http.routers.qeva_app.entrypoints=websecure

        - traefik.http.routers.qeva_app.tls=true
        - traefik.http.routers.qeva_app.tls.certresolver=letsencryptresolver

        - traefik.http.services.qeva_app.loadbalancer.server.port=3000

        - traefik.http.middlewares.qeva_sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.qeva_app.middlewares=qeva_sslheader

  qeva_worker:
    image: ${QEVA_IMAGE:?set QEVA_IMAGE to the image published in the registry}
    command:
      - sh
      - -c
      - set -a; . /run/secrets/qeva_env; set +a; exec docker/entrypoints/rails.sh bundle exec sidekiq -C config/sidekiq.yml
    secrets:
      - qeva_env
    volumes:
      - qeva_storage:/app/storage
    networks:
      - network_public
    environment:
      <<: *app-env

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s

      placement:
        constraints:
          - node.role == manager

      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

secrets:
  qeva_env:
    external: true

volumes:
  qeva_storage:

networks:
  network_public:
    external: true
