x-app-env: &app-env
  INSTALLATION_NAME: ${INSTALLATION_NAME:-QEVA CRM}
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker

  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
  FRONTEND_URL: https://${QEVA_DOMAIN:-crm.qeva.xyz}

  DEFAULT_LOCALE: es
  FORCE_SSL: "true"
  ENABLE_ACCOUNT_SIGNUP: "false"

  REDIS_URL: ${REDIS_URL:?set REDIS_URL}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-QEVA CRM <no-reply@qeva.xyz>}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-gmail.com}
  SMTP_ADDRESS: ${SMTP_ADDRESS:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: plain
  SMTP_ENABLE_STARTTLS_AUTO: "true"
  SMTP_OPENSSL_VERIFY_MODE: peer
  MAILER_INBOUND_EMAIL_DOMAIN: ${MAILER_INBOUND_EMAIL_DOMAIN:-gmail.com}

  POSTGRES_HOST: ${POSTGRES_HOST:-postgres_postgres-vector}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USERNAME: ${POSTGRES_USERNAME:-chatwoot_qeva}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot_qeva}

  ACTIVE_STORAGE_SERVICE: local
  RAILS_LOG_TO_STDOUT: "true"
  USE_INBOX_AVATAR_FOR_BOT: "true"

services:
  qeva_app:
    image: ${QEVA_IMAGE:?set QEVA_IMAGE to the image published in the registry}
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    entrypoint: docker/entrypoints/rails.sh

    volumes:
      - qeva_storage:/app/storage

    networks:
      - network_public

    environment:
      <<: *app-env

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s

      placement:
        constraints:
          - node.role == manager

      # 512M was too tight for Rails on this server; the upstream stack restarted under load.
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public

        - traefik.http.routers.qeva_app.rule=Host(`${QEVA_DOMAIN:-crm.qeva.xyz}`)
        - traefik.http.routers.qeva_app.service=qeva_app
        - traefik.http.routers.qeva_app.entrypoints=websecure

        - traefik.http.routers.qeva_app.tls=true
        - traefik.http.routers.qeva_app.tls.certresolver=letsencryptresolver

        - traefik.http.services.qeva_app.loadbalancer.server.port=3000

        - traefik.http.middlewares.qeva_sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.qeva_app.middlewares=qeva_sslheader

  qeva_worker:
    image: ${QEVA_IMAGE:?set QEVA_IMAGE to the image published in the registry}
    command: bundle exec sidekiq -C config/sidekiq.yml

    volumes:
      - qeva_storage:/app/storage

    networks:
      - network_public

    environment:
      <<: *app-env

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s

      placement:
        constraints:
          - node.role == manager

      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  qeva_storage:

networks:
  network_public:
    external: true
