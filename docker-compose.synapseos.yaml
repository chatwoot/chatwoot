# CUSTOMIZAÇÃO_SYNAPSEOS
# Compose de produção pra rodar a imagem pré-built do Synapse OS num VPS.
# Uso:
#   1. docker login ghcr.io (com PAT de leitura se o repo for privado)
#   2. cp .env.production.example .env && editar os segredos
#   3. docker compose -f docker-compose.synapseos.yaml pull
#   4. docker compose -f docker-compose.synapseos.yaml up -d
#   5. docker compose -f docker-compose.synapseos.yaml exec rails bundle exec rails db:chatwoot_prepare
services:
  base: &base
    image: ${SYNAPSEOS_IMAGE:-ghcr.io/YOUR_GH_OWNER/synapseos-core:latest}
    env_file: .env
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped

  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/']
      interval: 30s
      timeout: 5s
      retries: 3

  sidekiq:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-synapseos_production}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  storage_data:
