            send_attempted_at, created_at, updated_at]
campaigns:
  columns: [display_id, title, description, message, sender_id, inbox_id, enabled, campaign_type, campaign_status, scheduled_at,
            trigger_only_during_business_hours, started_at, completed_at, created_at, updated_at]
  json: [trigger_rules, audience]
canned_responses:
  columns: [short_code, content, created_at, updated_at]
captain_assistant_responses:
  columns: [question, answer, assistant_id, status, edited, created_at, updated_at]
captain_assistants:
  columns: [name, description, created_at, updated_at]
