# The account tables and columns Copilot may read. A table or column that is not listed here stays hidden, including
# any a later migration adds, so exposing data is a reviewed change to this file.
#
# Each table lists:
#   columns  the columns Copilot may filter, group and show; id is always readable
#   json     JSON columns Copilot may read whole and filter by key, written column.key
#   through  for a table without account_id, the belongs_to association that leads to a record with one
#
# Polymorphic foreign keys, such as messages.sender_id, are left out, because the same value names records in different
# tables. Tables the dashboard shows each user only for themselves, such as notifications and custom filters, are left out.
#
# conversations, contacts, messages, csat_survey_responses and articles have their own resource classes with their own
# permission rules. Every other table here is read by administrators only, through Captain::Copilot::Resources::Table.

conversations:
  columns: [display_id, inbox_id, status, priority, assignee_id, team_id, contact_id, campaign_id, sla_policy_id, created_at,
            updated_at, last_activity_at, first_reply_created_at, waiting_since, snoozed_until, status_changed_at,
            contact_last_seen_at, agent_last_seen_at, assignee_last_seen_at]
  json: [additional_attributes, custom_attributes]
contacts:
  columns: [name, middle_name, last_name, email, phone_number, identifier, contact_type, location, country_code, blocked, company_id,
            created_at, updated_at, last_activity_at]
  json: [additional_attributes, custom_attributes]
messages:
  columns: [content, conversation_id, inbox_id, message_type, content_type, private, status, created_at, updated_at]
csat_survey_responses:
  columns: [rating, feedback_message, conversation_id, message_id, contact_id, assigned_agent_id, created_at, updated_at]
articles:
  columns: [title, description, content, status, views, locale, slug, position, portal_id, category_id, folder_id, author_id,
            created_at, updated_at]

account_users:
  columns: [user_id, role, availability, auto_offline, custom_role_id, agent_capacity_policy_id, inviter_id, active_at, created_at,
            updated_at]
agent_bot_inboxes:
