services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: 'Node'
        RAILS_ENV: 'development'
        RAILS_SERVE_STATIC_FILES: 'false'
    tty: true
    stdin_open: true
    image: chatwit:development
    env_file: .env.ngrok

  rails:
    <<: *base
    image: chatwit:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - vite
      - mailhog
      - sidekiq
    ports:
      - 3000:3000
    env_file: .env.ngrok
    environment:
      - VITE_DEV_SERVER_HOST=vite
      - NODE_ENV=development
      - RAILS_ENV=development
    command: ["sh", "-c", "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b 0.0.0.0"]

  sidekiq:
    <<: *base
    image: chatwit:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  vite:
    <<: *base
    image: chatwit:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    ports:
      - "3036:3036" # Vite dev server
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - RAILS_ENV=development
    command: ["sh", "-c", "pnpm exec vite dev --host 0.0.0.0 --port 3036"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5433:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    env_file: .env.ngrok
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env.ngrok
    volumes:
      - redis:/data
    ports:
      - '6380:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  # ───────────────────────────────────────────────────────
  # NGROK - Serviço Docker para túnel público
  # ───────────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: chatwit_dev_ngrok
    environment:
      NGROK_AUTHTOKEN: "31A71USAsfWBPiCJZc9Dw39a35k_2fUqtFQChZSDBMvwS1bxw"
    command: http rails:3000 --domain=beagle-great-awfully.ngrok-free.app
    ports:
      - "4040:4040"  # Interface web do ngrok
    depends_on:
      - rails
    restart: unless-stopped

volumes:
  postgres:
  redis:
  packs:
  node_modules:
  cache:
  bundle: 