# Build-only config for optional fork builds.
# Production Chatwoot *web* is pinned to:
#   ghcr.io/railwayapp-templates/chatwoot:Community
# Do NOT put startCommand here while web runs the Community image —
# a fork-style startCommand breaks Community boots (empty deploy logs).
# Worker (fork) uses railway.worker.toml.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
watchPatterns = ["docker/**", "app/**", "config/**", "Gemfile", "Gemfile.lock", "package.json", "pnpm-lock.yaml"]
