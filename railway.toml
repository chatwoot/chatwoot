# Shared build config for Chatwoot web + worker (same Docker image).
# Deploy settings (start command, healthcheck, migrations) live in Railway
# per-service config — NOT here — so web (Puma) and worker (Sidekiq) differ.
#
# Web service:  start + preDeploy + /api healthcheck (set in Railway)
# Worker service: Sidekiq start, no HTTP healthcheck (set in Railway)
#
# See docs/RAILWAY.md and railway.worker.toml (reference copy for worker settings).

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
watchPatterns = ["docker/**", "app/**", "config/**", "Gemfile", "Gemfile.lock", "package.json", "pnpm-lock.yaml"]
