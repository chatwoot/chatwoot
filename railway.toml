# Chatwoot *web* service (Puma). Worker uses railway.worker.toml.
#
# Dockerfile already sets ENTRYPOINT=docker/entrypoints/rails.sh — do NOT
# prefix the start command with rails.sh again or the process exits before
# logging (Railway only shows "Stopping Container").

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
watchPatterns = ["docker/**", "app/**", "config/**", "Gemfile", "Gemfile.lock", "package.json", "pnpm-lock.yaml"]

[deploy]
# Args to ENTRYPOINT rails.sh (shell form so && works)
startCommand = "sh -c \"bundle exec rails ip_lookup:setup && bin/rails server -b 0.0.0.0 -p $PORT -e $RAILS_ENV\""
preDeployCommand = ["POSTGRES_STATEMENT_TIMEOUT=600s bundle exec rails db:chatwoot_prepare"]
healthcheckPath = "/api"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
