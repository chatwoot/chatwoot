# Chatwoot web config for *future* fork Docker deploys.
#
# Production web is pinned to:
#   ghcr.io/railwayapp-templates/chatwoot:Community
# because Railway Metal Docker builds for this project currently abort at
# "scheduling build" (no build logs). Do not set startCommand while on Community.
#
# When Docker builds work again:
#   1) service source -> Samersadek1/chatwoot@develop
#   2) builder Dockerfile path docker/Dockerfile
#   3) startCommand below (must be sh -c wrapped)
# Worker uses railway.worker.toml.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
watchPatterns = ["docker/**", "app/**", "config/**", "Gemfile", "Gemfile.lock", "package.json", "pnpm-lock.yaml"]

# [deploy] intentionally omitted for Community pin.
