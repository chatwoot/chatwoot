# fazer.ai fork translations.
#
# Rails deep-merges every config/locales/*.yml, so these keys land on top of
# upstream's <locale>.yml without touching it. Keys for our own features go
# here; upstream copy we merely translate does not.
#
# Adding a language means adding fazer_ai.<locale>.yml. Nothing else changes.
pt_BR:
  internal_chat:
    default_category_name: Canais
    default_channel_name: Geral
    messages:
      deleted: Esta mensagem foi excluída
  errors:
    articles:
      invalid_sort: Ordenação de artigos desconhecida. Use updated_at, created_at, title ou views, com - na frente para ordem decrescente.
    request:
      unexpected: Não foi possível completar a requisição.
    account:
      brand_name:
        invalid: não pode conter < ou >
      brand_url:
        invalid: precisa começar com http:// ou https://
      brand_logo_email:
        too_big: tem mais de 2 MB
        invalid_format: precisa ser PNG, JPG ou GIF
    automation:
      scheduled_message:
        delay_out_of_range: O atraso deve ser entre 1 minuto e 999 dias
        content_attachment_or_template_required: A mensagem agendada deve ter conteúdo, anexo ou template
    scheduled_messages:
      cannot_delete_processed: Não é possível excluir uma mensagem agendada que já foi enviada ou falhou
    conversations:
      already_assigned: "%{agent_name} já está atendendo esta conversa."
      outside_working_hours: "Esta caixa está fora do horário de funcionamento, então as conversas dela não podem ser atribuídas agora."
    conversation_pins:
      limit_reached: Você pode fixar no máximo %{limit} conversas.
      conversation_resolved: Não é possível fixar uma conversa resolvida.
      conversation_not_visible: Esta conversa não está na sua lista, então não pode ser fixada.
    meta:
      send_failed: Algo deu errado ao enviar esta mensagem e não foi possível confirmar a entrega. Confira a conversa antes de enviar novamente.
      messaging_window_closed: A janela de resposta da Meta para este contato fechou. Ela reabre quando o contato enviar uma nova mensagem.
      messaging_window_closed_for_automation: A Meta só aceita resposta automática até 24 horas depois da última mensagem do contato. Assuma a conversa para responder como agente.
    whatsapp:
      group_announcement_only: Somente administradores podem enviar mensagens neste grupo
      group_description_cannot_be_removed: O WhatsApp não permite remover a descrição de um grupo depois que ela existe. Substitua o texto em vez de apagá-lo.
    inboxes:
      channel:
        provider_unavailable: Este provedor de WhatsApp ainda não está disponível nesta instalação.
        invalid_provider_config: 'Configuração inválida em: %{keys}'
        credential_check_unavailable: não pôde ser conferida com o provedor agora, então nada foi salvo. Tente de novo em instantes.
        provider_not_enabled_for_account: Este provedor de WhatsApp está desativado para esta conta.
        provider_withdrawn: Este provedor de WhatsApp não é mais oferecido para novas caixas de entrada. As caixas que já usam ele continuam funcionando.
        cannot_unpair: Este provedor não consegue desvincular a conta do WhatsApp pareada com ele, então conectar de novo retomaria a mesma conta. Reinicie a instância no provedor, aponte esta caixa de entrada para outra, ou corrija o número configurado aqui.
        code_pairing_unsupported: Este provedor do WhatsApp não consegue parear com código. Escaneie o QR Code no lugar.
        history_sync_unsupported: Este provedor do WhatsApp não consegue buscar o histórico de uma conversa.
        outgoing:
          provider_error: O WhatsApp não conseguiu enviar esta mensagem no momento.
          provider_unreachable: Não foi possível alcançar o provedor do WhatsApp.
          disconnect_refused: O provedor não encerrou a sessão.
          disconnect_unreachable: Não foi possível alcançar o provedor para encerrar a sessão.
          send_timed_out: O envio excedeu o tempo limite; pode ou não ter chegado ao WhatsApp.
          send_outcome_unknown: O envio excedeu o tempo limite e pode ter sido concluído. Confira a conversa no WhatsApp antes de enviar novamente.
          send_stalled: A conexão com o WhatsApp não está aceitando envios no momento.
          media_too_large: O anexo é grande demais para ser enviado.
          invalid_payload: O WhatsApp recusou o conteúdo da mensagem.
          still_processing: A mensagem ainda estava sendo enviada em outro lugar e não foi possível confirmar.
          send_failed_after_retries: Não foi possível enviar a mensagem depois de várias tentativas. Envie novamente.
        provider_connection:
          wrong_phone_number: O número de telefone que você está tentando conectar não é o mesmo que o configurado. Certifique-se de que o número está correto antes de escanear o QR code.
          reconnect_loop_detected: Não foi possível restabelecer a conexão após várias tentativas. Novas tentativas automáticas continuam em intervalos crescentes. Se o problema persistir, desconecte a caixa de entrada e conecte novamente escaneando um novo QR code.
          send_stall_detected: Esta conexão está recebendo mensagens, mas não consegue enviá-las. Se não se resolver sozinha em alguns minutos, desconecte a caixa de entrada e conecte novamente escaneando um novo QR code.
          invalid_credentials: O provedor recusou as credenciais desta caixa de entrada. Confira o endereço e o token e tente novamente.
          logged_out: Este dispositivo foi desconectado do WhatsApp pelo celular. Conecte novamente para continuar recebendo mensagens.
          logged_out_by_request: Esta caixa de entrada foi desconectada do WhatsApp aqui mesmo. Conecte novamente para continuar recebendo mensagens.
          stream_replaced: Esta sessão foi substituída por outra conexão da mesma conta do WhatsApp. Conecte novamente para usar aqui.
          temporary_ban: O WhatsApp bloqueou temporariamente este número. Aguarde o fim do bloqueio antes de conectar novamente.
          client_outdated: O conector do WhatsApp está desatualizado e não consegue mais conectar. Atualize-o para restabelecer a conexão.
          quarantined: Muitas tentativas de reconexão falharam seguidas. Novas tentativas continuam em intervalos crescentes.
          connector_unavailable: O conector do WhatsApp não está respondendo. As mensagens só voltarão a ser enviadas quando ele retornar.
          connector_incompatible: A versão do conector do WhatsApp é incompatível com esta versão do Chatwoot. Atualize o conector.
          connect_failure: O WhatsApp recusou a conexão. Novas tentativas continuam automaticamente.
          pairing_timed_out: O código expirou antes de o telefone concluir o pareamento. Inicie a conexão novamente para obter um novo.
          pairing_pair_error: O WhatsApp aceitou o código mas não concluiu a conexão do dispositivo. Inicie a conexão novamente.
          pairing_err-scanned-without-multidevice: Esta conta do WhatsApp precisa ativar o multidispositivo antes de poder ser conectada.
          pairing_code_refused: O WhatsApp não quis enviar um código de pareamento para este número. Conecte o dispositivo pelo QR code.
          pairing_connect_failed: O conector não conseguiu falar com o WhatsApp para iniciar o pareamento. Tente novamente.
          connect_failed: O conector não conseguiu falar com o WhatsApp. Novas tentativas continuam automaticamente.
          disconnect_requested: 'Esta conexão foi encerrada aqui. O pareamento continua válido: conecte novamente para retomá-la.'
          disconnected: A conexão com o WhatsApp caiu. Novas tentativas continuam automaticamente.
          proxy_unreachable: A conexão com o WhatsApp não está passando pelo proxy desta caixa de entrada. Confira o endereço do proxy nas configurações da caixa de entrada, ou remova-o para conectar direto. Novas tentativas continuam automaticamente.
