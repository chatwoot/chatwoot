      description: 'Webhook ইভেন্টগুলি আপনার Chatwoot অ্যাকাউন্টে কার্যকলাপের রিয়েল-টাইম আপডেট প্রদান করে। আপনি আপনার পছন্দের ইভেন্টগুলিতে সাবস্ক্রাইব করতে পারেন, এবং Chatwoot আপনাকে আপডেটসহ HTTP কলব্যাক পাঠাবে।.'
    dialogflow:
      name: 'Dialogflow'
      short_description: 'এজেন্টদের কাছে হস্তান্তরের আগে প্রাথমিক প্রশ্নের উত্তর দেওয়ার জন্য চ্যাটবট তৈরি করুন।.'
      description: 'Dialogflow দিয়ে চ্যাটবট তৈরি করুন এবং সহজেই আপনার ইনবক্সে সংযুক্ত করুন। এই বটগুলি প্রাথমিক প্রশ্নের উত্তর দিতে পারে, তারপর প্রয়োজনে গ্রাহক সেবার প্রতিনিধির কাছে হস্তান্তর করবে।.'
    google_translate:
      name: 'Google Translate'
      short_description: 'এজেন্টদের জন্য স্বয়ংক্রিয়ভাবে গ্রাহকের বার্তা অনুবাদ করুন।.'
      description: "Google Translate সংযুক্ত করুন যাতে এজেন্টরা সহজেই গ্রাহকের বার্তা অনুবাদ করতে পারে। এই ইন্টিগ্রেশন স্বয়ংক্রিয়ভাবে ভাষা শনাক্ত করে এবং এজেন্ট বা অ্যাডমিনের পছন্দের ভাষায় রূপান্তর করে।."
    openai:
      name: 'OpenAI'
      short_description: 'এআই-চালিত উত্তর পরামর্শ, সারাংশ তৈরি এবং বার্তা উন্নতকরণ।.'
      description: 'Leverage the power of large language models from OpenAI with the features such as reply suggestions, summarization, message rephrasing, and spell-checking.'
    linear:
      name: 'লিনিয়ার'
      short_description: 'কথোপকথন থেকে সরাসরি Linear ইস্যু তৈরি ও সংযুক্ত করুন।.'
      description: 'আপনার কথোপকথনের উইন্ডো থেকেই সরাসরি Linear-এ ইস্যু তৈরি করুন। বিকল্পভাবে, বিদ্যমান Linear ইস্যুগুলিকে সংযুক্ত করুন আরও সহজ ও কার্যকর ইস্যু ট্র্যাকিংয়ের জন্য।.'
      attachment_link_title: 'Conversation (#%{conversation_id}) with %{name}'
    notion:
      name: 'Notion'
      short_description: 'ডাটাবেস, ডকুমেন্ট এবং পেজগুলো সরাসরি Captain-এর সাথে সংযুক্ত করুন।.'
      description: 'আপনার Notion ওয়ার্কস্পেস সংযুক্ত করুন যাতে Captain আপনার ডাটাবেস, ডকুমেন্ট এবং পেজের কনটেন্ট ব্যবহার করে আরও প্রাসঙ্গিক গ্রাহক সহায়তার জন্য বুদ্ধিমান উত্তর তৈরি ও প্রদান করতে পারে।.'
    shopify:
      name: 'Shopify'
      short_description: 'আপনার Shopify স্টোর থেকে অর্ডার বিবরণ এবং গ্রাহকের তথ্য দেখুন।.'
      description: 'আপনার Shopify স্টোর সংযুক্ত করুন যাতে আপনি অর্ডার বিবরণ, গ্রাহকের তথ্য এবং পণ্যের ডেটা সরাসরি আপনার কথোপকথনের মধ্যে দেখতে পারেন এবং আপনার সাপোর্ট টিমকে আরও দ্রুত ও প্রাসঙ্গিক সহায়তা দিতে সহায়তা করে।.'
    leadsquared:
      name: 'LeadSquared'
      short_description: 'আপনার যোগাযোগ এবং কথোপকথন LeadSquared CRM-এর সাথে সিঙ্ক করুন।.'
      description: 'আপনার যোগাযোগ এবং কথোপকথন LeadSquared CRM-এর সাথে সিঙ্ক করুন। এই ইন্টিগ্রেশনটি স্বয়ংক্রিয়ভাবে নতুন যোগাযোগ যোগ হলে LeadSquared-এ লিড তৈরি করে এবং কথোপকথনের কার্যকলাপ লগ করে, যাতে আপনার বিক্রয় দল সম্পূর্ণ প্রেক্ষাপট পায়।.'
