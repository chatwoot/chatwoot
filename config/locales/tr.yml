  integration_apps:
    stripe:
      name: 'Stripe'
      short_description: 'View customer billing details in conversations.'
      description: 'View customer details, subscriptions, and recent invoices from Stripe alongside your conversations.'
    #Note: webhooks and dashboard_apps don't need short_description as they use different modal components
    dashboard_apps:
      name: 'Panel Uygulamaları'
      description: 'Panel Uygulamaları, kullanıcı bilgilerini, siparişleri veya ödeme geçmişini gösteren uygulamalar oluşturmanıza ve bunları panelinize eklemenize olanak tanır. Bu sayede müşteri destek temsilcileriniz daha fazla bağlam bilgisine sahip olur.'
    dyte:
      name: 'Dyte'
      short_description: 'Müşterilerle doğrudan Chatwoot üzerinden video/sesli arama başlatın.'
      description: 'Dyte, uygulamanıza ses ve video işlevselliklerini entegre eden bir üründür. Bu entegrasyon sayesinde temsilcileriniz, Chatwoot üzerinden müşterilerinizle doğrudan video veya sesli görüşme başlatabilir.'
      meeting_name: '%{agent_name} bir toplantı başlattı'
    slack:
      name: 'Slack'
      short_description: 'Doğrudan Slack''te bildirimler alın ve konuşmalara yanıt verin.'
      description: "Chatwoot’u Slack ile entegre ederek ekibinizin senkronize çalışmasını sağlayın. Bu entegrasyon sayesinde yeni konuşmalar için bildirim alabilir ve onlara doğrudan Slack arayüzünden yanıt verebilirsiniz."
    webhooks:
      name: 'Webhooks'
      description: 'Webhook etkinlikleri, Chatwoot hesabınızdaki faaliyetlerle ilgili gerçek zamanlı güncellemeler sağlar. Tercih ettiğiniz etkinliklere abone olabilir ve Chatwoot size bu güncellemelerle HTTP geri çağrıları (callback) gönderecektir.'
    dialogflow:
      name: 'Dialogflow botu'
      short_description: 'Temsilcilere aktarmadan önce ilk soruları yanıtlayacak sohbet botları oluşturun.'
      description: 'Dialogflow ile sohbet botları oluşturun ve bunları gelen kutunuza kolayca entegre edin. Bu botlar, müşteri hizmetleri temsilcisine yönlendirmeden önce ilk soruları karşılayabilir.'
    google_translate:
      name: 'Google Çeviri'
      short_description: 'Müşteri mesajlarını temsilciler için otomatik olarak çevirin.'
      description: "Google Translate’i entegre ederek temsilcilerin müşteri mesajlarını kolayca çevirmesine yardımcı olun. Bu entegrasyon, mesajın dilini otomatik olarak algılar ve temsilcinin veya yöneticinin tercih ettiği dile çevirir."
    openai:
      name: 'OpenAI'
      short_description: 'Yapay zekâ destekli yanıt önerileri, özetleme ve mesaj geliştirme.'
      description: 'Leverage the power of large language models from OpenAI with the features such as reply suggestions, summarization, message rephrasing, and spell-checking.'
    linear:
      name: 'Linear'
      short_description: 'Linear sorunlarını doğrudan sohbetlerden oluşturun ve bağlayın.'
      description: 'Create issues in Linear directly from your conversation window. Alternatively, link existing Linear issues for a more streamlined and efficient issue tracking process.'
      attachment_link_title: 'Conversation (#%{conversation_id}) with %{name}'
    notion:
      name: 'Notion'
      short_description: 'Veritabanlarını, dokümanları ve sayfaları doğrudan Captain ile entegre edin.'
      description: 'Captain''ın veritabanlarınız, dokümanlarınız ve sayfalarınızdaki içeriklere erişebilmesi ve bunları kullanarak daha bağlamsal bir müşteri desteği sunan akıllı yanıtlar oluşturabilmesi için Notion çalışma alanınızı bağlayın.'
    shopify:
      name: 'Shopify'
      short_description: 'Shopify mağazanızdan sipariş detaylarına ve müşteri verilerine erişin.'
      description: 'Connect your Shopify store to access order details, customer information, and product data directly within your conversations and helps your support team provide faster, more contextual assistance to your customers.'
    leadsquared:
      name: 'LeadSquared'
      short_description: 'Kişilerinizi ve sohbetlerinizi LeadSquared CRM ile senkronize edin.'
      description: 'Kişilerinizi ve sohbetlerinizi LeadSquared CRM ile senkronize edin. Bu entegrasyon, yeni kişiler eklendiğinde otomatik olarak LeadSquared''da potansiyel müşteri oluşturur ve satış ekibinize tam bağlam sağlamak için sohbet etkinliğini kaydeder.'
