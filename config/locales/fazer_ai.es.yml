# fazer.ai fork translations.
#
# Rails deep-merges every config/locales/*.yml, so these keys land on top of
# upstream's <locale>.yml without touching it. Keys for our own features go
# here; upstream copy we merely translate does not.
#
# Adding a language means adding fazer_ai.<locale>.yml. Nothing else changes.
es:
  whatsapp_catalog:
    price: '%{number} %{unit}'
    separator: ','
    delimiter: '.'
    product_unreadable: Mensaje con un producto del catálogo. Míralo en WhatsApp.
    order_title: Pedido %{id}
    item_count:
      one: 1 artículo
      other: '%{count} artículos'
    estimated_total: '%{total} (total estimado)'
  internal_chat:
    default_category_name: Canales
    default_channel_name: General
    messages:
      deleted: Este mensaje fue eliminado
  errors:
    attachments:
      video_note:
        with_text: La videonota no lleva texto. Envía el texto en un mensaje aparte.
        not_alone: La videonota va sola. Envía los demás archivos en mensajes aparte.
    articles:
      invalid_sort: Orden de artículos desconocido. Usa updated_at, created_at, title o views, con - delante para orden descendente.
    request:
      unexpected: No se pudo completar la solicitud.
    account:
      brand_name:
        invalid: no puede contener < ni >
      brand_url:
        invalid: debe empezar con http:// o https://
      brand_logo_email:
        too_big: supera los 2 MB
        invalid_format: debe ser PNG, JPG o GIF
    automation:
      scheduled_message:
        delay_out_of_range: El retraso debe estar entre 1 minuto y 999 días
        content_attachment_or_template_required: El mensaje programado debe tener contenido, un archivo adjunto o una plantilla
    scheduled_messages:
      cannot_delete_processed: No se puede eliminar un mensaje programado que ya se envió o que falló
    conversations:
      already_assigned: "%{agent_name} ya está atendiendo esta conversación."
      outside_working_hours: "Esta bandeja está fuera de su horario de atención, así que sus conversaciones no se pueden asignar ahora."
    conversation_pins:
      limit_reached: Puede fijar hasta %{limit} conversaciones.
      conversation_resolved: No se puede fijar una conversación resuelta.
      conversation_not_visible: Esta conversación no está en su lista, así que no se puede fijar.
    meta:
      send_failed: Algo salió mal al enviar este mensaje y no se pudo confirmar la entrega. Revise la conversación antes de enviarlo de nuevo.
      messaging_window_closed: La ventana de respuesta de Meta para este contacto se cerró. Se reabre cuando el contacto envíe un mensaje nuevo.
      messaging_window_closed_for_automation: Meta solo acepta respuestas automáticas hasta 24 horas después del último mensaje del contacto. Toma la conversación para responder como agente.
    whatsapp:
      group_announcement_only: Solo los administradores pueden enviar mensajes en este grupo
      group_description_cannot_be_removed: WhatsApp no permite eliminar la descripción de un grupo una vez definida. Reemplace el texto en lugar de borrarlo.
    inboxes:
      channel:
        provider_unavailable: Este proveedor de WhatsApp aún no está disponible en esta instalación.
        invalid_provider_config: 'Configuración inválida en: %{keys}'
        credential_check_unavailable: no se pudo comprobar con el proveedor en este momento, así que no se guardó nada. Inténtalo de nuevo en unos instantes.
        provider_not_enabled_for_account: Este proveedor de WhatsApp está desactivado para esta cuenta.
        provider_withdrawn: Este proveedor de WhatsApp ya no se ofrece para bandejas de entrada nuevas. Las que ya lo usan siguen funcionando.
        cannot_unpair: Este proveedor no puede desvincular la cuenta de WhatsApp emparejada con él, así que conectar de nuevo retomaría la misma cuenta. Reinicia la instancia en el proveedor, apunta esta bandeja de entrada a otra, o corrige el número configurado aquí.
        code_pairing_unsupported: Este proveedor de WhatsApp no puede emparejarse con un código. Escanea el código QR en su lugar.
        history_sync_unsupported: Este proveedor de WhatsApp no puede traer el historial de un chat.
        outgoing:
          provider_error: WhatsApp no pudo enviar este mensaje en este momento.
          provider_unreachable: No se pudo contactar al proveedor de WhatsApp.
          disconnect_refused: El proveedor no finalizó la sesión.
          disconnect_unreachable: No se pudo contactar al proveedor para finalizar la sesión.
          send_timed_out: El envío superó el tiempo límite; puede o no haber llegado a WhatsApp.
          send_outcome_unknown: El envío superó el tiempo límite y puede haberse completado. Revise la conversación en WhatsApp antes de enviarla de nuevo.
          send_stalled: La conexión con WhatsApp no está aceptando envíos en este momento.
          media_too_large: El archivo adjunto es demasiado grande para enviarlo.
          invalid_payload: WhatsApp rechazó el contenido del mensaje.
          still_processing: El mensaje aún se estaba enviando en otro lugar y no se pudo confirmar.
          send_failed_after_retries: No se pudo enviar el mensaje después de varios intentos. Envíelo de nuevo.
        provider_connection:
          wrong_phone_number: El número de teléfono que intenta vincular no es el mismo que tiene configurado. Verifique que el número sea correcto antes de escanear el código QR.
          reconnect_loop_detected: No se pudo restablecer la conexión después de varios intentos. Los reintentos automáticos continúan a intervalos cada vez mayores. Si el problema persiste, desconecte la bandeja de entrada y vuelva a vincularla escaneando un código QR nuevo.
          send_stall_detected: Esta conexión está recibiendo mensajes pero no puede enviarlos. Si no se resuelve por sí sola en unos minutos, desconecte la bandeja de entrada y conéctela de nuevo escaneando un nuevo código QR.
          invalid_credentials: El proveedor rechazó las credenciales de esta bandeja de entrada. Verifique la dirección y el token e inténtelo de nuevo.
          logged_out: Este dispositivo fue desconectado de WhatsApp desde el teléfono. Vuelva a vincularlo para seguir recibiendo mensajes.
          logged_out_by_request: Esta bandeja fue desconectada de WhatsApp desde aquí. Vuelva a vincularla para seguir recibiendo mensajes.
          stream_replaced: Esta sesión fue reemplazada por otra conexión de la misma cuenta de WhatsApp. Vuelva a vincularla para usarla aquí.
          temporary_ban: WhatsApp bloqueó temporalmente este número. Espere a que termine el bloqueo antes de volver a vincularlo.
          client_outdated: El conector de WhatsApp está desactualizado y ya no puede conectarse. Actualícelo para restablecer la conexión.
          quarantined: Demasiados intentos de reconexión fallidos seguidos. Los nuevos intentos continúan a intervalos cada vez mayores.
          connector_unavailable: El conector de WhatsApp no responde. Los mensajes volverán a enviarse cuando esté disponible.
          connector_incompatible: La versión del conector de WhatsApp es incompatible con esta versión de Chatwoot. Actualice el conector.
          connect_failure: WhatsApp rechazó la conexión. Los nuevos intentos continúan automáticamente.
          pairing_timed_out: El código expiró antes de que el teléfono completara la vinculación. Inicie la conexión de nuevo para obtener uno nuevo.
          pairing_pair_error: WhatsApp aceptó el código pero no terminó de vincular el dispositivo. Inicie la conexión de nuevo.
          pairing_err-scanned-without-multidevice: Esta cuenta de WhatsApp debe activar el multidispositivo antes de poder vincularse.
          pairing_code_refused: WhatsApp no quiso enviar un código de vinculación a este número. Vincule el dispositivo con el código QR.
          pairing_connect_failed: El conector no pudo comunicarse con WhatsApp para iniciar la vinculación. Inténtelo de nuevo.
          connect_failed: El conector no pudo comunicarse con WhatsApp. Los reintentos continúan automáticamente.
          disconnect_requested: 'Esta conexión fue cerrada desde aquí. La vinculación sigue válida: conecte de nuevo para retomarla.'
          disconnected: La conexión con WhatsApp se cayó. Los reintentos continúan automáticamente.
          proxy_unreachable: La conexión con WhatsApp no está pasando por el proxy de esta bandeja de entrada. Revisa la dirección del proxy en la configuración de la bandeja de entrada, o elimínala para conectar directamente. Los nuevos intentos continúan automáticamente.
  notifications:
    notification_title:
      internal_chat_mention: Le mencionaron en %{name}
      internal_chat_new_message: Mensaje nuevo de %{name}
