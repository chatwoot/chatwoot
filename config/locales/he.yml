      description: 'בנה צאטבוטים עם Dialogflow ושלב אותם בקלות בתיבת הדואר הנכנס שלך. בוטים אלה יכולים לטפל בשאלות ראשוניות לפני העברתן לסוכן שירות לקוחות.'
    google_translate:
