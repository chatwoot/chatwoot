      name: 'Applications du tableau de bord'
      description: 'Les applications du tableau de bord vous permettent de créer et d''intégrer des applications qui affichent les informations de l''utilisateur, les commandes ou l''historique des paiements, fournissant plus de contexte à vos agents d''assistance client.'
    dyte:
      name: 'Cloudflare RealtimeKit'
      short_description: 'Démarrez des appels vidéo/vocaux avec vos clients directement à partir de Chatwoot.'
      description: 'Cloudflare RealtimeKit permet à vos agents de lancer des appels vidéo et vocaux avec vos clients directement depuis Chatwoot.'
      meeting_name: '%{agent_name} a démarré une réunion'
    slack:
      name: 'Slack'
      short_description: 'Recevez des notifications et répondez aux conversations directement dans Slack.'
      description: "Intégrez Chatwoot avec Slack pour garder votre équipe en synchronisation. Cette intégration vous permet de recevoir des notifications pour les nouvelles conversations et d'y répondre directement dans l'interface de Slack."
    webhooks:
      name: 'Webhooks'
      description: 'Les événements de webhook fournissent des mises à jour en temps réel sur les activités de votre compte Chatwoot. Vous pouvez vous abonner aux événements de votre choix, et Chatwoot vous enverra des rappels HTTP contenant les mises à jour.'
    dialogflow:
      name: 'Dialogflow'
      short_description: 'Construire des chatbots pour gérer les requêtes initiales avant de les transférer aux agents.'
      description: 'Construisez des chatbots avec Dialogflow et intégrez-les facilement dans votre boîte de réception. Ces robots peuvent gérer les requêtes initiales avant de les transférer à un agent de service client.'
    google_translate:
      name: 'Google Translate'
      short_description: 'Traduire automatiquement les messages clients pour les agents.'
      description: "Intégrez Google Translate pour aider les agents à traduire facilement les messages clients. Cette intégration détecte automatiquement la langue et la convertit en la langue préférée de l'agent ou de l'administrateur."
    openai:
      name: 'OpenAI'
      short_description: 'Suggestions de réponse, récapitulation et amélioration des messages.'
      description: 'Leverage the power of large language models from OpenAI with the features such as reply suggestions, summarization, message rephrasing, and spell-checking.'
    linear:
      name: 'Linear'
      short_description: 'Créer et lier des tickets Linear directement à partir de conversations.'
      description: 'Créez des tickets dans Linear directement à partir de votre fenêtre de conversation. Ou liez des tickets Linear existants pour un processus de suivi des problèmes plus rationalisé et plus efficace.'
      attachment_link_title: 'Conversation (#%{conversation_id}) avec %{name}'
    notion:
      name: 'Notion'
      short_description: 'Intégrer les bases de données, les documents et les pages directement avec Captain.'
      description: 'Connectez votre espace de travail Notion pour permettre à Captain d''accéder et de générer des réponses intelligentes en utilisant le contenu de vos bases de données, des documents et des pages pour fournir un support client plus contextuel.'
    shopify:
      name: 'Shopify'
      short_description: 'Accédez aux détails de la commande et aux données client de votre boutique Shopify.'
      description: 'Connectez votre boutique Shopify pour accéder aux détails des commandes, aux informations sur les clients et aux données des produits directement dans vos conversations, afin d’aider votre équipe de support à fournir une assistance plus rapide et plus contextuelle à vos clients.'
    leadsquared:
      name: 'LeadSquared'
      short_description: 'Synchronisez vos contacts et conversations avec LeadSquared CRM.'
      description: 'Synchronisez vos contacts et conversations avec LeadSquared CRM. Cette intégration crée automatiquement des prospects dans LeadSquared lorsque de nouveaux contacts sont ajoutés, et enregistre l''activité des conversations pour fournir à votre équipe de vente un contexte complet.'
