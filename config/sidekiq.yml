# Sample configuration file for Sidekiq.
# Options here can still be overridden by cmd line args.
# Place this file at config/sidekiq.yml and Sidekiq will
# pick it up automatically.
---
:verbose: false
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>
:timeout: 25
:max_retries: 3

# Sidekiq will run this file through ERB when reading it so you can
# even put in dynamic logic, like a host-specific queue.
# http://www.mikeperham.com/2013/11/13/advanced-sidekiq-host-specific-queues/
# https://github.com/sidekiq/sidekiq/wiki/Advanced-Options
# Queues are named by the maximum time a job in them is allowed to wait.
# Strict ordering: a queue is only polled when every queue above it is empty.
# purgable holds jobs that are safe to delete from the Sidekiq UI during an incident.
:queues:
  - within_5_seconds
  - within_1_minute
  - within_10_minutes
  - within_1_day
  - purgable
  # Legacy names, kept so jobs already enqueued before the rename still drain. Remove in a later release.
  - critical
  - high
  - medium
  - default
  - mailers
  - low
  - scheduled_jobs
  - deferred
  - housekeeping
  - async_database_migration
  - bulk_reindex_low

# you can override concurrency based on environment
production:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>
staging:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>
