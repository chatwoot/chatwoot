default: &default
  adapter: redis
  url: <%= ENV.fetch('REDIS_URL', 'redis://127.0.0.1:6379') %>
  password: <%= ENV.fetch('REDIS_PASSWORD', nil).presence %>
  ssl_params: 
    verify_mode: <%= Chatwoot.redis_ssl_verify_mode %>
  channel_prefix: <%= "chatwoot_#{Rails.env}_action_cable" %>
   # Retry Redis reconnections with exponential backoff to recover from temporary Redis outages and service restarts.
  reconnect_attempts: [0.25, 0.5, 1, 2, 3, 5, 5, 10, 10, 30, 30, 60]  
development:
  <<: *default

test:
  adapter: test
  channel_prefix: <%= "chatwoot_#{Rails.env}_action_cable"  %>

staging:
  <<: *default

production:
  <<: *default
