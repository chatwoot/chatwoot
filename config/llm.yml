providers:
  openai:
    display_name: 'OpenAI'

models:
  gpt-5.1:
    provider: openai
    display_name: 'GPT-5.1'
    credit_multiplier: 2
  gpt-5.2:
    provider: openai
    display_name: 'GPT-5.2'
    credit_multiplier: 3
  gpt-6-luna:
    provider: openai
    display_name: 'GPT-6 Luna'
    credit_multiplier: 1
    reasoning_effort: none
    # Luna accepts temperature only at reasoning effort none. Kept explicit because models.dev has listed it as unsupported before.
    temperature: true
  # GPT-6 models default to medium reasoning effort, which rejects temperature, so features without their own effort run them at none.
  gpt-6-sol:
    provider: openai
    display_name: 'GPT-6 Sol'
    credit_multiplier: 2
    reasoning_effort: none
  gpt-6.1-terra:
    provider: openai
    display_name: 'GPT-6.1 Terra'
    credit_multiplier: 1
    reasoning_effort: none
  gpt-6.1-sol:
    provider: openai
    display_name: 'GPT-6.1 Sol'
    credit_multiplier: 2
  gpt-transcribe:
    provider: openai
    display_name: 'GPT Transcribe'
    credit_multiplier: 1
  gpt-audio-1.5:
    provider: openai
    display_name: 'GPT-Audio 1.5'
    credit_multiplier: 1
  text-embedding-3-small:
    provider: openai
    display_name: 'Text Embedding 3 Small'
    credit_multiplier: 1

features:
  conversation_completion:
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-6-luna
    internal: true
  editor:
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-6-luna
  assistant:
    reasoning_effort: none
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-6-luna
  # Copilot. Reasoning stays off: at medium the model asked agents
  # for a scope instead of reviewing, and reviews ran two to three times slower with no gain in the eval.
  copilot_workflows:
    reasoning_effort: none
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-5.2
  document_faq_generation:
    reasoning_effort: medium
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-6-luna
  conversation_faq_generation:
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-5.2
  conversation_faq_matching:
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-6-luna
  pdf_faq_generation:
    models: [gpt-6-luna, gpt-6.1-terra, gpt-6-sol, gpt-5.1, gpt-5.2]
    default: gpt-6-luna
  help_center_article_generation:
    models:
      [
        gpt-6-luna,
        gpt-6.1-terra,
        gpt-6-sol,
        gpt-5.1,
        gpt-5.2,
      ]
    default: gpt-5.2
  onboarding_content_generation:
    models:
      [gpt-6-luna, gpt-6.1-terra, gpt-6-sol, gpt-5.1, gpt-5.2]
    default: gpt-6-luna
  help_center_query_translation:
    models: [gpt-6-luna]
    default: gpt-6-luna
  message_translation:
    models: [gpt-6-luna, gpt-6.1-terra, gpt-6-sol, gpt-6.1-sol, gpt-5.2]
    default: gpt-6-luna
  language_detection:
    models: [gpt-6-luna]
    default: gpt-6-luna
  audio_transcription:
    models: [gpt-transcribe]
    default: gpt-transcribe
  call_announcement:
    models: [gpt-audio-1.5]
    default: gpt-audio-1.5
  help_center_search:
    models: [text-embedding-3-small]
    default: text-embedding-3-small
