schema_version: 1
key: example
name: Example Support
description: Minimal provider pack used to prove the catalog contract.
api_version: v1
authentication:
  strategy: oauth
allowed_origins:
  - https://api.example.com
categories:
  - key: customers
    name: Customers
    description: Look up customer information.
operations:
  - key: find_customer
    source: openapi
    reference: openapi.yml#/paths/~1customers/get
    visibility: runtime
    scopes:
      - customers:read
    risk_class: read
    fixtures:
      success: fixtures/find_customer_success.json
      errors:
        - fixtures/authorization_error.json
  - key: list_customers_for_setup
    source: graphql
    reference: operations/list_customers.graphql
    endpoint: https://api.example.com/graphql
    visibility: setup
    scopes:
      - customers:read
    risk_class: read
    fixtures:
      success: fixtures/find_customer_success.json
      errors:
        - fixtures/graphql_error.json
templates:
  - key: get_current_customer
    version: 1.0.0
    name: Get current customer
    description: Find the provider customer bound to the current Chatwoot contact.
    category_key: customers
    availability: available
    input_schema: schemas/get_current_customer_input.json
    configuration_schema: schemas/empty_configuration.json
    output_schema: schemas/get_current_customer_output.json
    recipe:
      - operation_key: find_customer
        bindings:
          email:
            source: contact
            path: email
