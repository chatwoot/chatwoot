openapi: 3.0.3
info:
  title: Example Support API
  version: v1
servers:
  - url: https://api.example.com
paths:
  /customers:
    get:
      operationId: findCustomer
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer lookup result
