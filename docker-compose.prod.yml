# CUSTOMIZAÇÃO_SYNAPSEOS — deploy production em VPS única.
#
# Modelo de entrega: 1 VPS por cliente (ex: Interlivre). Este compose sobe
# a stack completa (web + worker + postgres + redis) com volume
# compartilhado pra storage do ActiveStorage — resolve mídia outbound
# automática sem precisar S3/R2.
#
# Pré-requisitos na VPS:
#  - Docker + Docker Compose v2
#  - Domínio apontado pro IP da VPS (ex: chatwoot.cliente.com.br)
#  - Proxy reverso (nginx/caddy/traefik) na frente pra SSL
#
# Setup:
#  1. cp .env.example.prod .env  e preencher os REPLACE_ME
#  2. docker compose -f docker-compose.prod.yml pull
#  3. docker compose -f docker-compose.prod.yml up -d
#     (o serviço `release` roda db:chatwoot_prepare automaticamente
#      antes do web/worker subirem, em cold start e em cada upgrade)
#
# Upgrade:
#  docker compose -f docker-compose.prod.yml pull && \
#    docker compose -f docker-compose.prod.yml up -d

# Rotação padrão pra todos os serviços (evita disco enchendo com log).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app: &app
  image: ${SYNAPSEOS_IMAGE:-ghcr.io/dexi-digital/synapseos-core}:${SYNAPSEOS_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  logging: *default-logging

services:
  release:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: /app/docker/entrypoints/prod.sh
    command: bundle exec rails db:chatwoot_prepare

  web:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    volumes:
      - storage:/app/storage
      - public_packs:/app/public/packs
    entrypoint: /app/docker/entrypoints/prod.sh
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    volumes:
      - storage:/app/storage
    entrypoint: /app/docker/entrypoints/prod.sh
    command: bundle exec sidekiq -C config/sidekiq.yml
    healthcheck:
      # Sidekiq não expõe HTTP. Checa se o processo master ainda está vivo.
      test: ["CMD-SHELL", "pgrep -f 'sidekiq' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg14
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Synapseos Agentic (opt-in) ------------------------------------------
  # Painel FastAPI/Celery do `dexidigital/synapseos-agentic` rodando ao lado
  # do Chatwoot. Compose isolado: usa profile `agentic` pra não subir por
  # default. Pra ativar: `docker compose --profile agentic up -d`.
  #
  # Configurações no .env do Chatwoot (super_admin → Installation Configs):
  #   SYNAPSEOS_AGENTIC_URL=http://agentic:8000        (interno, container-to-container)
  #   SYNAPSEOS_AGENTIC_PANEL_URL=https://chatwoot.cliente.com.br/_agentic/
  #   SYNAPSEOS_AGENTIC_USER=admin
  #   SYNAPSEOS_AGENTIC_PASSWORD=...
  #   SYNAPSEOS_AGENTIC_ENABLED=true
  #
  # Caddy (docker/Caddyfile.example) roteia `/_agentic/*` pro container abaixo.
  agentic:
    profiles: ["agentic"]
    image: ${SYNAPSEOS_AGENTIC_IMAGE:-ghcr.io/dexidigital/synapseos-agentic:latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY}
      PANEL_ADMIN_USER: ${SYNAPSEOS_AGENTIC_USER:-admin}
      PANEL_ADMIN_PASSWORD: ${SYNAPSEOS_AGENTIC_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:8000:8000"   # bind apenas em loopback; Caddy faz o proxy público
    volumes:
      - agentic_data:/data
      - agentic_clients:/app/clients
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  # `storage` compartilhado entre web e worker — crítico pra mídia outbound
  # (AgentBot/Avisa) funcionar sem S3. Ambos os serviços leem/escrevem
  # atachments nesse mesmo diretório.
  storage:
  public_packs:
  postgres_data:
  redis_data:
  agentic_data:
  agentic_clients:
