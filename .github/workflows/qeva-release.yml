# QEVA CRM release pipeline.
# Trigger: pushing a tag vX.Y.Z (for example v1.0.0).
# Steps: validate tag -> CI -> build image -> scan image -> push to ghcr.io -> GitHub release -> Portainer redeploy.

name: QEVA Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check vX.Y.Z
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' does not match vX.Y.Z" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  ci:
    name: Validation
    needs: validate-tag
    uses: ./.github/workflows/qeva-ci.yml
    permissions:
      contents: read

  build:
    name: Build, scan and push image
    needs: [validate-tag, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/qeva-crm
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (trivy, critical only)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push (version and latest)
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

  release:
    name: Create GitHub release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release (skip if it already exists)
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" --verify-tag --generate-notes
          fi

  deploy:
    name: Redeploy stack in Portainer
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Call Portainer webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "PORTAINER_WEBHOOK_URL is not set" >&2
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
          echo "Portainer responded HTTP $status"
          [ "$status" = "200" ] || [ "$status" = "204" ]
