name: Armazém — Build & Deploy

# Fork-specific pipeline (Armazém de Minas).
# Independente dos workflows upstream (publish_foss_docker.yml etc.),
# que pushavam para chatwoot/chatwoot e não funcionam com credenciais do fork.

on:
  push:
    branches:
      - develop
      - main
      - master
    tags:
      - v*
  workflow_dispatch:

env:
  IMAGE_NAME: luancamara/chatwoot-armazem

jobs:
  build-and-deploy:
    name: Build image & trigger deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether deployment requires database migrations
        id: migrations
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- db/migrate | grep -q .; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Database migrations changed. Publishing the image only; deploy through the maintenance runbook after backup and migrations."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          # Preview branch builds publish only an immutable SHA tag.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/develop" || "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            {
              echo "tags<<EOF"
              echo "${{ env.IMAGE_NAME }}:latest"
              echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Portainer
        if: github.event_name != 'workflow_dispatch' && steps.migrations.outputs.required != 'true' && github.ref_type == 'branch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID || '1' }}
        run: |
          # Force-update every Chatwoot service to the same immutable image.
          SERVICE_NAMES="chatwoot_chatwoot_app chatwoot_chatwoot_worker chatwoot_chatwoot_worker_rt"

          ALL_SERVICES_JSON=$(curl -s -k -H "X-API-Key: $PORTAINER_TOKEN" \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/services")

          if ! echo "$ALL_SERVICES_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::Portainer API did not return a service list."
            echo "Response: $ALL_SERVICES_JSON" | head -c 500
            exit 1
          fi

          echo "--- Services visible to Portainer (endpoint $ENDPOINT_ID) ---"
          echo "$ALL_SERVICES_JSON" | jq -r '.[] | .Spec.Name' | sort
          echo "---"

          UPDATED_ANY=0

          for SVC_NAME in $SERVICE_NAMES; do
            echo "=== Looking for service: $SVC_NAME ==="

            SVC_ID=$(echo "$ALL_SERVICES_JSON" | jq -r \
              --arg n "$SVC_NAME" \
              '.[] | select(.Spec.Name == $n) | .ID')

            if [ -z "$SVC_ID" ]; then
              echo "::error::Service '$SVC_NAME' was not found"
              exit 1
            fi

            echo "  Found: $SVC_NAME ($SVC_ID)"

            SVC_DATA=$(curl -s -k -H "X-API-Key: $PORTAINER_TOKEN" \
              "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/services/$SVC_ID")

            VERSION=$(echo "$SVC_DATA" | jq '.Version.Index')
            echo "  Version: $VERSION"

            UPDATED_SPEC=$(echo "$SVC_DATA" | jq \
              --arg img "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              '.Spec | .TaskTemplate.ContainerSpec.Image = $img | .TaskTemplate.ForceUpdate += 1')

            HTTP_CODE=$(echo "$UPDATED_SPEC" | curl -s -k -o /tmp/update-resp.txt -w "%{http_code}" \
              -X POST \
              -H "X-API-Key: $PORTAINER_TOKEN" \
              -H "Content-Type: application/json" \
              -d @- \
              "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/services/$SVC_ID/update?version=$VERSION")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  Updated successfully (HTTP $HTTP_CODE)"
              UPDATED_ANY=$((UPDATED_ANY + 1))
            else
              echo "::error::Failed to update $SVC_NAME (HTTP $HTTP_CODE)"
              echo "Response: $(cat /tmp/update-resp.txt)"
              exit 1
            fi
          done

          if [ "$UPDATED_ANY" -ne 3 ]; then
            echo "::error::Expected to update 3 Chatwoot services, updated $UPDATED_ANY."
            exit 1
          fi

          echo "All Chatwoot services updated."
