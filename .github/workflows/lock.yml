# Lock threads that have been inactive for over a month
# Prevents noise from old closed issues/PRs

name: 'Lock Threads'

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          issue-inactive-days: '30'
          issue-lock-reason: 'resolved'
          pr-inactive-days: '30'
          pr-lock-reason: 'resolved'
