name: Publish Codespace Base Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-code-space-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Codespace Base Image
        run: |
          docker compose -f .devcontainer/docker-compose.base.yml build base
          docker push ghcr.io/${{ github.repository_owner }}/whisker_codespace:latest
