name: Test Docker Build

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs read the cache that the base branch writes. A PR writes its own cache
      # only when it changes the Dockerfile or gems, because the base branch
      # cache does not have those layers.
      - name: Check for Dockerfile or gem changes
        id: build_inputs
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- docker/Dockerfile Gemfile Gemfile.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: ${{ steps.build_inputs.outputs.changed == 'true' && format('type=gha,mode=max,scope={0}', matrix.platform) || '' }}
