# Dependency update PRs for ai-service only (our Go service).
# Issue: DEV-Johnstocker/chatwoot#1
#
# Chatwoot's own Ruby/JS dependencies and its workflows come from upstream
# merges, so they are deliberately not listed here. GitHub Actions are left out
# too: Dependabot cannot limit them to our ai-service*.yml files and would open
# PRs against Chatwoot's workflows. Every PR still goes through CI and review;
# nothing merges automatically. A 7-day cooldown skips versions published in
# the last week, when a compromised or broken release is most likely.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /ai-service
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    target-branch: develop
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ['*']
    commit-message:
      prefix: '🔧 chore(ai-service)'

  - package-ecosystem: docker
    directory: /ai-service
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    target-branch: develop
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: '🔧 chore(ai-service)'

  # Image tags in the Dokploy compose files (production and staging). This is
  # how a new Chatwoot release reaches us: Dependabot opens a PR bumping
  # chatwoot/chatwoot, which we review (Rails migrations run on start), merge
  # and ship with /deploy. Major Redis versions and the pgvector image (its tag
  # is the Postgres major, and a data directory can't move across majors) are
  # upgraded by hand, never by a bot PR.
  - package-ecosystem: docker-compose
    directory: /ai-service/deploy
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    target-branch: develop
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: pgvector/pgvector
      - dependency-name: redis
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: '🔧 chore(ai-service)'
