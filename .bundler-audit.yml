# Gem advisories that `bundle-audit check` must not fail on, each with the reason it is safe.
#
# Dependency versions are upstream's: a fixed gem reaches the fork through the upstream sync, not
# through a bump of our own. So a new advisory is ignored here with the reason and the issue that
# assessed it. When the vulnerable path is reachable on this install, the entry says so, and the fix
# is backported under config/initializers/monkey_patches/ with a spec when a local patch is practical;
# when it is not (a server's internals, for example), the advisory stays ignored until the sync.
# When the upstream sync brings the fixed version, its entry (and any backport) goes.
ignore:
  - GHSA-57hq-95w6-v4fc # Devise confirmable race condition — patched locally in User model (remove once on Devise 5+)
  # Devise 5 is currently blocked by devise-secure_password/devise_token_auth/devise-two-factor.
  # Chatwoot does not enable Timeoutable, so the timeout redirect path is not reachable.
  - GHSA-jp94-3292-c3xv
  # RubyLLM's name-normalization ReDoS is reported on Ruby 3.1; we require Ruby 3.4.13.
  # Built-in tool names are fixed; custom tools use bounded slugs and override normalization.
  # Patched 2.0 releases need an ai-agents migration (currently constrained to RubyLLM 1.x).
  # Remove when a supported patched RubyLLM/ai-agents combination is adopted.
  - CVE-2026-67991
  # Think-tag parsing and Mistral matching ReDoS are reported on Ruby 3.1.
  # We pin Ruby 3.4.13, where the affected regexes are linear-time.
  # Remove when a supported patched RubyLLM/ai-agents combination is adopted;
  # reassess if the supported Ruby runtime changes.
  - CVE-2026-67987
  - CVE-2026-67989
  # Puma 7.2.2 memory exhaustion with SSL connections. Puma here binds a plain port
  # (config/puma.rb), and TLS ends at the proxy in front of it, so no SSL connection
  # reaches Puma. Remove when the upstream sync brings Puma >= 7.2.3.
  - GHSA-4v6q-hvv7-49h9
  # rack-protection 4.2.1 (CookieTossing, HostAuthorization, and JsonCsrf/RemoteToken/
  # RemoteReferrer with a missing Referer). It comes in through omniauth, which uses only
  # Rack::Protection::AuthenticityToken; none of the affected middlewares is mounted.
  # Remove when the upstream sync brings rack-protection >= 4.2.2.
  - GHSA-pf75-2v58-7mxg
  - GHSA-r29j-38x9-qr26
  - GHSA-vvhm-j6m8-64cw
