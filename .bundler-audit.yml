# Gem advisories that `bundle-audit check` must not fail on, each with the reason it is safe.
#
# Dependency versions are upstream's: a fixed gem reaches the fork through the upstream sync, not
# through a bump of our own. So a new advisory is ignored here with the reason and the issue that
# assessed it. When the vulnerable path is reachable on this install, the entry says so, and the fix
# is backported under config/initializers/monkey_patches/ with a spec when a local patch is practical;
# when it is not (a server's internals, for example), the advisory stays ignored until the sync.
# When the upstream sync brings the fixed version, its entry (and any backport) goes.
ignore:
  - GHSA-57hq-95w6-v4fc # Devise confirmable race condition — patched locally in User model (remove once on Devise 5+)
  # Devise 5 is currently blocked by devise-secure_password/devise_token_auth/devise-two-factor.
  # Chatwoot does not enable Timeoutable, so the timeout redirect path is not reachable.
  - GHSA-jp94-3292-c3xv
  # Active Storage variant processing; mitigated locally, patched in Rails 7.2.3.2.
  # Remove once on Rails 7.2.3.2+.
  - CVE-2026-66066
  # Rails advisories published 2026-11-04, patched only in 8.0.5.2 and 8.1.4.1 (no 7.2 release).
  # Reachability for this install is assessed in https://github.com/fazer-ai/chatwoot/issues/930.
  # Remove all of them once on Rails >= 8.0.5.2.
  # Backported locally (config/initializers/monkey_patches):
  - GHSA-v924-7rp8-4mxh # Active Storage tempfile extension picks the ffprobe/vips decoder
  - GHSA-8474-xrp6-wh69 # safe_constantize regexp reachable from anonymous /cable subscribe
  # Not reachable: the variant processor is :vips (load_defaults 7.0), so the ImageMagick
  # analyzer never runs, nothing calls MiniMagick, and libvips runs with VIPS_BLOCK_UNTRUSTED=1.
  - GHSA-f3w6-w445-fwh9
  # Not reachable: no code passes the return value of params.each_key to mass assignment.
  - GHSA-wm3x-v3qw-4jh3
  # Medium and low, assessed in the issue above:
  - GHSA-5957-c7qm-m469 # Mailgun ingress signature replay: only with RAILS_INBOUND_EMAIL_SERVICE=mailgun
  - GHSA-2586-8ghr-69fj # CacheStore sessions: the session store is :cookie_store
  - GHSA-gmj8-hvj3-49mw # missing SameSite: the session cookie sets same_site: :lax explicitly
  - GHSA-r9jg-fmfx-2gv6 # missing Vary: Accept: only matters behind a shared cache of API responses
  - GHSA-rwvh-fw6r-pwvp # ActionController::Live DoS: no controller includes ActionController::Live
  - GHSA-x6mj-8jx9-qhqv # session cookie on Active Storage proxy: needs rotated secrets or a hybrid serializer
  - GHSA-2p2f-4rq4-gjwc # Action View XSS (highlight with an attribute highlighter): not used that way
  - GHSA-68p9-83h6-5wpj # Action View XSS (simple_format with the HTML5 sanitizer): not used that way
  - GHSA-rq8q-p985-fjq7 # Action View XSS (strip_tags in an HTML attribute): the one use renders into JSON
  - GHSA-v6rj-xm57-3p59 # Action View XSS (whitespace Symbol attribute names): not used that way
  - GHSA-3f4q-8x5m-76v8 # HLS playlist read by ffprobe: uploads go through authenticated endpoints; low
  - GHSA-3w93-6hmw-whh4 # GCS direct uploads: only with the GCS storage service
  - GHSA-hfr4-8rjc-97m2 # GCS direct uploads: only with the GCS storage service
  - GHSA-p2pm-g2h6-7j5j # NUL in filename: needs a database that stores NUL bytes; Postgres rejects them
  # msgpack JRuby decoder allocation (2026-11-14): only the JRuby extension is affected; this install runs MRI.
  - GHSA-73v3-wf97-vpgj
  # Puma 7.2.1 advisories (2026-11-15), fixed in 7.2.2; upstream is still on 7.2.1 and the version comes with the sync.
  # Not reachable: pumactl's SSL control server and ssl_cipher_filter are not used (Puma serves plain HTTP behind the proxy).
  - GHSA-86xc-wrr9-xmmq
  - GHSA-r885-m39c-939g
  # Reachable: slow-client and resource-exhaustion DoS. The Coolify/Traefik deploy streams request bodies to Puma
  # without buffering, so a client can trickle a body or stop reading. No practical local backport (Puma's reactor);
  # accepted until the upstream sync brings Puma >= 7.2.2.
  - GHSA-jm4r-w4xx-qxw7
  - GHSA-m5xw-3hrw-qcmf
  - GHSA-rf6g-xhmp-gm7v
  - GHSA-x646-wp7c-h9mg
  - GHSA-xw3h-pgr9-3vg7
