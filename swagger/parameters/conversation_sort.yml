name: sort_by
in: query
description: Order conversations before pagination. Last message sorting requires the account feature and places conversations without public messages last.
schema:
  type: string
  default: last_activity_at_desc
  enum:
    - last_activity_at_asc
    - last_activity_at_desc
    - last_message_at_desc
    - last_message_at_asc
    - created_at_asc
    - created_at_desc
    - priority_asc
    - priority_desc
    - waiting_since_asc
    - waiting_since_desc
    - priority_desc_created_at_asc
    - unread
