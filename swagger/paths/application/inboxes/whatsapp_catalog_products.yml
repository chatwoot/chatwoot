get:
  tags:
    - Inboxes
  operationId: listWhatsappInboxCatalogProducts
  summary: List the products of the WhatsApp catalog of an inbox
  security:
    - userBearerAuth: []
    - userApiKey: []
  description: |
    Read one page of products from the catalog of a WhatsApp Cloud inbox, optionally filtered by name or
    collection. Every request reads a single page from Meta; pass `next_cursor` as `after` to get the next one.
    The first page without search is cached for 15 minutes per inbox and collection.

    A failure to read the catalog is reported in `status` (`no_catalog`, `missing_permission` or `error`)
    with a 200 response, not as an HTTP error.
  parameters:
    - $ref: '#/components/parameters/account_id'
    - name: id
      in: path
      schema:
        type: number
      description: ID of the WhatsApp Cloud inbox
      required: true
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 24
      description: Products per page
      required: false
    - name: after
      in: query
      schema:
        type: string
      description: Cursor returned as `next_cursor` by the previous page
      required: false
    - name: q
      in: query
      schema:
        type: string
      description: Search by product name, run by Meta
      required: false
    - name: collection_id
      in: query
      schema:
        type: string
      description: Only return products of this collection (it must belong to the catalog)
      required: false
    - name: refresh
      in: query
      schema:
        type: boolean
      description: Skip the cache of the first page
      required: false
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ok
                  - no_catalog
                  - missing_permission
                  - error
              products:
                type: array
                description: Present when status is ok
                items:
                  type: object
                  properties:
                    retailer_id:
                      type: string
                    name:
                      type: string
                    price:
                      type: string
                    image_urls:
                      type: array
                      items:
                        type: string
                    description:
                      type:
                        - string
                        - 'null'
                    url:
                      type:
                        - string
                        - 'null'
                    collection_ids:
                      type: array
                      items:
                        type: string
              next_cursor:
                type:
                  - string
                  - 'null'
                description: Cursor of the next page, null on the last one
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/bad_request_error'
    '404':
      description: Inbox not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/bad_request_error'
    '422':
      description: The inbox is not a WhatsApp Cloud inbox, the limit is out of range, a filter is not a string or the collection does not belong to the catalog
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/bad_request_error'
