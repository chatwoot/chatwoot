tags:
  - Audit Logs
operationId: get-account-audit-logs
summary: List Audit Logs in Account
description: Get Details of Audit Log entries for an Account. This endpoint is only available in Enterprise editions and requires the audit_logs feature to be enabled.
security:
  - userApiKey: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      default: 1
  - name: q
    in: query
    description: Filter entries by the name or email of the user who performed the action
    required: false
    schema:
      type: string
  - name: types
    in: query
    description: Filter entries by the type of the audited record
    required: false
    schema:
      type: array
      items:
        type: string
        example: Inbox
  - name: since
    in: query
    description: Only return entries created at or after this unix timestamp
    required: false
    schema:
      type: integer
      example: 1755388800
  - name: until
    in: query
    description: Only return entries created at or before this unix timestamp
    required: false
    schema:
      type: integer
      example: 1755993599
  - name: sort
    in: query
    description: Order of the entries by creation time
    required: false
    schema:
      type: string
      enum:
        - desc
        - asc
      default: desc
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            per_page:
              type: integer
              description: Number of items per page
              example: 25
            total_entries:
              type: integer
              description: Total number of audit log entries
              example: 150
            current_page:
              type: integer
              description: Current page number
              example: 1
            audit_logs:
              type: array
              description: Array of audit log entries
              items:
                $ref: '#/components/schemas/audit_log'
  403:
    description: Access denied
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  422:
    description: Feature not enabled or not available in current plan
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
