openapi: '3.1.0'
info:
  title: Chatwoot - Client API
  description: Client API endpoints for Chatwoot
  version: 1.1.0
  termsOfService: https://www.chatwoot.com/terms-of-service/
  contact:
    email: hello@chatwoot.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://app.chatwoot.com/
tags:
  - name: Contacts API
    description: APIs for managing contacts from client applications
  - name: Conversations API
    description: APIs for managing conversations from client applications
  - name: Messages API
    description: APIs for managing messages from client applications
paths:
  $ref: ../paths/index.yml
components:
  schemas:
    $ref: ../definitions/index.yml
  parameters:
    $ref: ../parameters/index.yml
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Available from Chatwoot `v4.19.0`. Send an existing user, agent bot, or platform app token as `Authorization: Bearer <token>`. Get tokens from **Profile Settings**, **Settings → Agent Bots**, or **Super Admin**, respectively. Existing permissions still apply; the `api_access_token` header remains supported.'
    userApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: 'Deprecated from Chatwoot `v4.19.0`; use `bearerAuth` instead. The `api_access_token` header still works. Get a user token from **Profile Settings**; access follows the user’s permissions.'
