type: object
title: WhatsApp channel settings
properties:
  phone_number:
    type: string
    description: WhatsApp phone number
    example: '+15551234567'
  provider:
    type: string
    description: WhatsApp provider. `default` is supported only for existing deprecated 360dialog setups.
    enum: ['whatsapp_cloud', 'default']
    example: whatsapp_cloud
  provider_config:
    type: object
    description: WhatsApp provider configuration. Cloud channels use `api_key`, `phone_number_id`, `business_account_id`, and `app_secret`; legacy 360dialog channels use `api_key`.
    properties:
      api_key:
        type: string
        description: Provider API key
        example: your-api-key
      phone_number_id:
        type: string
        description: Phone number ID for WhatsApp Cloud
        example: your-phone-number-id
      business_account_id:
        type: string
        description: Business account ID for WhatsApp Cloud
        example: your-business-account-id
      app_secret:
        type: string
        description: App secret of your Meta app, used to verify incoming webhook signatures. Required for manually configured Cloud channels that already have one, when moving an embedded signup channel to manual setup, and when switching a channel to `whatsapp_cloud`. It cannot be removed once set.
        example: your-app-secret
    example:
      api_key: your-api-key
      phone_number_id: your-phone-number-id
      business_account_id: your-business-account-id
      app_secret: your-app-secret
