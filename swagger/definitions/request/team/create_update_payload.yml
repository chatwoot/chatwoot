type: object
properties:
  name:
    type: string
    description: The name of the team
    example: Support Team
  description:
    type: string
    description: The description of the team
    example: This is a team of support agents
  allow_auto_assign:
    type: boolean
    description: If this setting is turned on, the system would automatically assign the conversation to an agent in the team while assigning the conversation to a team
    example: true
  icon:
    type: string
    description: An emoji or icon shown next to the team
    example: "🚀"
  icon_color:
    type: string
    description: The color used for the team icon
    example: "#6C5CE7"
  widen_calls:
    type: string
    enum:
      - inbox_agents
      - team_members
      - assignee_only
    description: "Who else rings when a voice call's assignee cannot take it: everyone in the inbox (default), only this team, or nobody else (this team when the call has no assignee). The call's team is the conversation's team, else the assignee's only team"
    example: inbox_agents
