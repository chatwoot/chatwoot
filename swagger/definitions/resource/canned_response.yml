type: object
properties:
  id:
    type: integer
    description: ID of the canned response
  account_id:
    type: integer
    description: Account Id
  short_code:
    type: string
    description: Short Code for quick access of the canned response
  content:
    type: string
    description: Message content for canned response
  category:
    type: string
    description: Optional category label for grouping canned responses
  visibility:
    type: string
    enum: [personal, global]
    description: personal (author only) or global (all agents in the account)
  created_by_id:
    type: integer
    description: User id of the creator
  created_at:
    type: string
    description: The date and time when the canned response was created
  updated_at:
    type: string
    description: The date and time when the canned response was updated
