type: object
properties:
  id:
    type: integer
  content:
    type:
      - string
      - 'null'
    description: The text content.
  description:
    type:
      - string
      - 'null'
  draft_title:
    type:
      - string
      - 'null'
    description: Unpublished title staged in the editor.
  draft_content:
    type:
      - string
      - 'null'
    description: Unpublished content staged in the editor.
  meta:
    type: object
  position:
    type:
      - integer
      - 'null'
  status:
    type: string
    enum: ['draft', 'published', 'archived']
  title:
    type: string
  slug:
    type: string
  views:
    type:
      - integer
      - 'null'
  updated_at:
    type: integer
    description: Unix timestamp of the last update.
  portal_id:
    type: integer
  account_id:
    type: integer
  author_id:
    type: integer
  category_id:
    type: integer
  folder_id:
    type: integer
  associated_article_id:
    type: integer
    description: To associate similar articles to each other, e.g to provide the link for the reference.
  category:
    type: object
    description: The category of the article. All fields are null for an uncategorized article.
    properties:
      id:
        type:
          - integer
          - 'null'
      name:
        type:
          - string
          - 'null'
      slug:
        type:
          - string
          - 'null'
      locale:
        type:
          - string
          - 'null'
      icon:
        type:
          - string
          - 'null'
      icon_color:
        type:
          - string
          - 'null'
  author:
    $ref: '#/components/schemas/agent'
  associated_articles:
    type: array
    description: Translations of this article. Only a root article has translations.
    items:
      $ref: '#/components/schemas/associated_article'
