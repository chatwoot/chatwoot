[package]
name = "whisker-pet"
version = "0.1.0"
description = "Whisker Desktop Pet — Pawly"
authors = ["Whisker"]
edition = "2021"

[lib]
name = "whisker_pet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
