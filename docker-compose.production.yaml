services:
  base: &base
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: whisker/whisker:latest
    env_file: .env ## Change this file for customized env variables
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-whisker}
      - POSTGRES_DB=whisker
      - REDIS_URL=redis://:${REDIS_PASSWORD:-whisker}@redis:6379
    volumes:
      - storage_data:/app/storage

  db_setup:
    <<: *base
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 'db:prepare']
    restart: "no"
    depends_on:
      - postgres
      - redis

  rails:
    <<: *base
    depends_on:
      db_setup:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      db_setup:
        condition: service_completed_successfully
    environment:
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=whisker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-whisker}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-whisker}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
