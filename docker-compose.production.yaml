version: '3'

# Chatwoot production stack — uses the prebuilt image from ghcr.io/kira-id.
# Secrets/connection params come from the repo .env via env_file (POSTGRES_*,
# REDIS_URL, SECRET_KEY_BASE, etc.). Bring it up with:
#   docker compose -f docker-compose.production.yaml up -d
x-base: &base
  image: ghcr.io/kira-id/chatwoot:latest
  env_file: .env
  volumes:
    - storage_data:/app/storage

services:

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command:
      - bundle
      - exec
      - rails
      - s
      - -p
      - '3000'
      - -b
      - 0.0.0.0
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file: .env
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    image: redis:alpine
    restart: always
    # Only enable requirepass when a REDIS_PASSWORD is actually set. The .env
    # currently has an empty REDIS_PASSWORD, and REDIS_URL=redis://redis:6379
    # (no auth), so requirepass would make Redis reject connections.
    command:
      - sh
      - -c
      - 'if [ -n "$REDIS_PASSWORD" ]; then redis-server --requirepass "$REDIS_PASSWORD"; else redis-server; fi'
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

  whatsapp-companion:
    image: ghcr.io/kira-id/whatsapp-companion:latest
    restart: always
    environment:
      - CHATWOOT_URL=http://rails:3000
      - CHATWOOT_SHARED_TOKEN=${WHATSAPP_COMPANION_TOKEN:-changeme}
      - PORT=4000
    volumes:
      - companion_auth:/app/auth
      - companion_media:/app/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - rails

volumes:
  storage_data:
  postgres_data:
  redis_data:
  companion_auth:
  companion_media:
