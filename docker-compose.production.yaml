version: '3'

services:
  base: &base
    image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:latest}
    env_file: .env ## Change this file for customized env variables
    volumes:
      - storage_data:/app/storage

  # One-shot migration job. web and worker only start after it exits 0, so a failing
  # migration stops the release before any running instance is touched.
  migrate:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_STATEMENT_TIMEOUT=600s
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 'db:chatwoot_prepare']
    restart: 'no'

  rails:
    <<: *base
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      # Run more than one replica behind the proxy for zero-downtime rolling updates (see docker/deploy.sh).
      replicas: ${WEB_REPLICAS:-1}
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Puma drains in-flight requests on SIGTERM; give it time before Docker sends SIGKILL.
    stop_grace_period: ${WEB_STOP_GRACE_PERIOD:-60s}
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    healthcheck:
      # sidekiq_alive serves liveness on port 7433 (a Redis heartbeat, so it also proves Redis is reachable).
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7433/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sidekiq waits up to SIDEKIQ_SHUTDOWN_TIMEOUT for running jobs on SIGTERM; the grace period must be longer.
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-150s}
    restart: always

  # Reverse proxy on the same host port as before. Traffic goes to every rails replica
  # via Docker DNS, which is re-resolved every second, so replicas join and leave without a reload.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:3000:3000'
    configs:
      - source: proxy_conf
        target: /etc/nginx/conf.d/default.conf
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Please provide your own password.
      - POSTGRES_PASSWORD=

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

configs:
  proxy_conf:
    content: |
      # Docker's embedded DNS; re-resolve every second so new and removed replicas are picked up quickly.
      resolver 127.0.0.11 valid=1s ipv6=off;

      # Keep the websocket upgrade for ActionCable; plain requests close the upstream connection
      # after each response, so a replica that is stopping never races a reused keep-alive connection.
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        '' close;
      }

      # Preserve the scheme set by an external TLS terminator, otherwise use the scheme of this request.
      map $$http_x_forwarded_proto $$forwarded_proto {
        default $$http_x_forwarded_proto;
        '' $$scheme;
      }

      server {
        listen 3000;
        client_max_body_size 100m;

        location / {
          set $$backend http://rails:3000;
          proxy_pass $$backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$forwarded_proto;
          proxy_read_timeout 300s;
          # Retry only connection-level failures (replica stopped or not yet listening). Requests that were
          # already sent are never retried, so non-idempotent requests are not duplicated.
          proxy_next_upstream error;
          proxy_next_upstream_tries 3;
        }
      }

volumes:
  storage_data:
  postgres_data:
  redis_data:
