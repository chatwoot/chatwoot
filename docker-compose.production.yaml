x-base: &base
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file:
    - .env
  volumes:
    - storage_data:/app/storage
  networks:
    - default
    - dokploy-network

services:
  prepare:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command:
      - bundle
      - exec
      - rails
      - db:chatwoot_prepare
    restart: 'no'

  rails:
    <<: *base
    depends_on:
      prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command:
      - bundle
      - exec
      - rails
      - s
      - -p
      - '3000'
      - -b
      - 0.0.0.0
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml
    restart: always

 postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in Dokploy Environment}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
      - dokploy-network

  redis:
    image: redis:alpine
    restart: always
    command:
      - sh
      - -c
      - redis-server --requirepass "$REDIS_PASSWORD"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - default
      - dokploy-network

volumes:
  storage_data:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
