version: "3.8"

# Stack do Chatwoot Synapseos (fork).
# Usa imagem buildada do fork e publicada no registry self-hosted.
#
# Pré-requisitos:
#   - Imagem em ghcr.io/paraisolorrayne/synapseos-chatwoot:$TAG
#   - Network overlay `traefik` (do Traefik, externa)
#   - Network overlay `app` (compartilhada com postgres_postgres e pgvector_pgvector)
#       Se as stacks postgres/pgvector não estão numa rede compartilhada,
#       precisará reconfigurar para que app/sidekiq alcancem o banco.
#   - Secrets criados:
#       printf "<chave-64-chars>" | docker secret create chatwoot_secret_key_base -
#       printf "<senha>" | docker secret create chatwoot_postgres_password -
#       printf "<smtp-password>" | docker secret create chatwoot_smtp_password -
#   - Variáveis de ambiente: ver `.env.example` na raiz do repo do fork
#
# Deploy:
#   TAG=v0.1.0-synapseos docker stack deploy -c docker-stack.yml chatwoot

x-chatwoot-base: &chatwoot-base
  image: ghcr.io/paraisolorrayne/synapseos-chatwoot:${TAG:?defina TAG}
  networks:
    - dexinet
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker

    # URL pública (importante para emails, webhooks, links)
    FRONTEND_URL: https://chat.dexidigital.com.br

    # Postgres principal (Chatwoot) — user dedicado criado em 04/05
    POSTGRES_HOST: postgres_postgres
    POSTGRES_PORT: 5432
    POSTGRES_DATABASE: chatwoot_production
    POSTGRES_USERNAME: chatwoot
    POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:?defina CHATWOOT_DB_PASSWORD}

    # pgvector (embeddings/AI) — mesmo user/senha
    PGVECTOR_HOST: pgvector_pgvector
    PGVECTOR_PORT: 5432
    PGVECTOR_DATABASE: chatwoot_vectors
    PGVECTOR_USERNAME: chatwoot
    PGVECTOR_PASSWORD: ${CHATWOOT_DB_PASSWORD:?defina CHATWOOT_DB_PASSWORD}

    # Redis (mesma stack)
    REDIS_URL: redis://chatwoot_redis:6379

    # Secret key (entrypoint do Chatwoot não suporta _FILE)
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?defina CHATWOOT_SECRET_KEY_BASE}

    # Storage local (R2/S3 fica para iteração futura)
    ACTIVE_STORAGE_SERVICE: local

    # SMTP — vazio por enquanto, configurar via super admin depois
    MAILER_SENDER_EMAIL: noreply@dexidigital.com.br
    SMTP_DOMAIN: dexidigital.com.br
    SMTP_ADDRESS: ""
    SMTP_PORT: ""
    SMTP_USERNAME: ""
    SMTP_PASSWORD: ""
    SMTP_AUTHENTICATION: plain
    SMTP_ENABLE_STARTTLS_AUTO: "true"

    # Synapseos Agentic Panel (link no super admin)
    AGENTIC_PANEL_URL: https://painel.dexidigital.com.br

    # Branding (white-label) — nome oficial conforme Manual de Identidade Visual Synka.
    # Synka é o produto principal da Dexi Digital; "Revenue Operating Intelligence".
    BRAND_NAME: Synka
    INSTALLATION_NAME: Synka

    # Security baseline (audit maio/2026). Quando true, Rails:
    # - redireciona HTTP → HTTPS
    # - adiciona Strict-Transport-Security header
    # - marca cookies como Secure (impede session leak via downgrade)
    FORCE_SSL: "true"

services:
  app:
    <<: *chatwoot-base
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
      labels:
        - traefik.enable=true
        - traefik.docker.network=dexinet
        - traefik.http.routers.chatwoot.rule=Host(`chat.dexidigital.com.br`)
        - traefik.http.routers.chatwoot.entrypoints=websecure
        - traefik.http.routers.chatwoot.tls=true
        - traefik.http.routers.chatwoot.tls.certresolver=letsencryptresolver
        - traefik.http.services.chatwoot.loadbalancer.server.port=3000
        # ActionCable / WebSocket + security headers (audit maio/2026 enterprise prep)
        - traefik.http.routers.chatwoot.middlewares=chatwoot-headers
        - traefik.http.middlewares.chatwoot-headers.headers.customrequestheaders.X-Forwarded-Proto=https
        # CSP — frame-ancestors 'self' permite widget iframado pelo próprio domínio
        # (Chatwoot embeds widgets); script-src/style-src 'unsafe-inline' por
        # compatibilidade com Vue inline e iconlets. Refinar quando UI eliminar inline.
        - "traefik.http.middlewares.chatwoot-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https:; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
        # Defense-in-depth (Rails já adiciona HSTS via FORCE_SSL=true)
        - traefik.http.middlewares.chatwoot-headers.headers.customResponseHeaders.Permissions-Policy=camera=(self), microphone=(self), geolocation=()
        - traefik.http.middlewares.chatwoot-headers.headers.referrerPolicy=strict-origin-when-cross-origin

  sidekiq:
    <<: *chatwoot-base
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
      labels:
        - traefik.enable=false

  redis:
    image: redis:7-alpine
    networks:
      - dexinet
    volumes:
      - chatwoot_redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  chatwoot_storage:
  chatwoot_redis_data:

networks:
  dexinet:
    external: true
    name: dexinet
