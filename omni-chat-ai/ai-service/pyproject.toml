[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "omni-chat-ai-service"
version = "0.1.0"
description = "Multi-agent AI service for the Omni-Chat-AI unified chat panel (Chatwoot agent-bot)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydantic-ai>=1.0",
    "langgraph>=0.2",            # MIT library only — do NOT add langgraph-api (Elastic License)
    "langfuse>=2.50",
    "qdrant-client>=1.12",
    # Admin panel + runtime settings store (API keys entered in the UI, not .env)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "cryptography>=43",          # Fernet encryption for secrets at rest
    "bcrypt>=4.1",               # admin password hashing
    "itsdangerous>=2.2",         # signed session cookies
    "jinja2>=3.1",               # server-rendered admin templates
    "python-multipart>=0.0.9",   # form posts from the admin panel
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
