{% extends "base.html" %}
{% block title %}Welcome{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-semibold text-slate-900">Welcome to Omni-Chat-AI</h1>
      <p class="mt-2 text-sm text-slate-500">Create your administrator account to get started.</p>
    </div>
    <form method="post" action="/admin/setup"
          class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-8 space-y-5">
      {% if error %}
      <p class="rounded-lg bg-red-50 text-red-700 text-sm px-3 py-2">{{ error }}</p>
      {% endif %}
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input name="email" type="email" required autofocus
               class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm
                      focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input name="password" type="password" required minlength="8"
               class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm
                      focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
        <p class="mt-1 text-xs text-slate-400">At least 8 characters.</p>
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-indigo-600 text-white text-sm font-medium py-2.5
                     hover:bg-indigo-500 transition">Create account</button>
    </form>
  </div>
</div>
{% endblock %}
