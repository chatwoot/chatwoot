# LiteLLM model gateway — provider-agnostic routing.
# Claude is the primary brain; the agents only ever call the aliases `claude-primary` /
# `claude-fast`. Those aliases are created at runtime from the admin panel (DB mode), so the
# provider API key is entered in the UI and never lives in a file.

# Model definitions are stored in the DB (created via the panel). The list below stays empty;
# an optional OpenAI fallback can be re-added here if a static key is preferred.
model_list: []

litellm_settings:
  drop_params: true
  num_retries: 2
  # Emit every LLM call (latency, tokens, cost) to Langfuse so traces have real spans to
  # evaluate. Reads LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST from the env.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # If claude-primary fails, transparently retry on the fast alias.
  fallbacks: [{ "claude-primary": ["claude-fast"] }]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Persist models created via /model/new so panel-entered keys survive restarts.
  store_model_in_db: true
  database_url: os.environ/LITELLM_DATABASE_URL
