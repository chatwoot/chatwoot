x-base: &base
  build:
    context: .
    dockerfile: ./docker/Dockerfile
    args:
      BUNDLE_WITHOUT: ''
      EXECJS_RUNTIME: 'Node'
      RAILS_ENV: 'development'
      RAILS_SERVE_STATIC_FILES: 'false'
  tty: true
  stdin_open: true
  env_file: .env

services:

  rails:
    <<: *base
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mailhog:
        condition: service_started
      sidekiq:
        condition: service_started
      # Without a reachable dev server every /vite-dev/ asset request falls
      # through the proxy into Rails routing and fails with RoutingError.
      # Don't serve pages until Vite reports healthy.
      vite:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      - VITE_RUBY_HOST=vite
      - NODE_ENV=development
      - RAILS_ENV=development
    entrypoint: ["/bin/sh", "docker/entrypoints/rails.sh"]
    command:
      - bundle
      - exec
      - rails
      - s
      - -p
      - '3000'
      - -b
      - 0.0.0.0

  sidekiq:
    <<: *base
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - pnpm_store:/app/.pnpm-store
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
    entrypoint: ["/bin/sh", "docker/entrypoints/sidekiq.sh"]
    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml

  vite:
    <<: *base
    image: chatwoot-vite:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - pnpm_store:/app/.pnpm-store
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    ports:
      - '3036:3036'
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - RAILS_ENV=development
      # On Docker Desktop for Windows, inotify file-change events are NOT
      # forwarded across the host bind mount, so Vite never detects edits and
      # hot reload silently stops working. Force chokidar to poll instead.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    entrypoint: ["/bin/sh", "docker/entrypoints/vite.sh"]
    command:
      - bin/vite
      - dev
    healthcheck:
      # The dev server can hang with the process alive but the port unbound;
      # probe the actual HTTP endpoint rather than trusting process state.
      test: ['CMD', 'curl', '-sf', '--max-time', '3', 'http://127.0.0.1:3036/vite-dev/@vite/client']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres:/data/postgres
    environment:
      # Point Postgres' data directory at the mounted volume. Without this,
      # Postgres uses its image-default /var/lib/postgresql/data, which lives
      # in the container's ephemeral layer and is wiped on every rebuild —
      # that is why the DB had to be re-migrated after each `docker compose up`.
      - PGDATA=/data/postgres
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password

  redis:
    image: redis:alpine
    restart: always
    command:
      - sh
      - -c
      - redis-server --requirepass "$REDIS_PASSWORD"
    env_file: .env
    volumes:
      - redis:/data
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  whatsapp-companion:
    build:
      context: ./whatsapp-companion
      dockerfile: ./Dockerfile
    restart: always
    environment:
      - CHATWOOT_URL=http://rails:3000
      - CHATWOOT_SHARED_TOKEN=${WHATSAPP_COMPANION_TOKEN:-changeme}
      - PORT=4000
    volumes:
      - companion_auth:/app/auth
      - companion_media:/app/media
    ports:
      - '4000:4000'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - rails

volumes:
  postgres:
  redis:
  packs:
  node_modules:
  pnpm_store:
  cache:
  bundle:
  companion_auth:
  companion_media:
