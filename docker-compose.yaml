version: "3.9"

x-app-volumes: &app-volumes
  - ./:/app:delegated
  - node_modules:/app/node_modules
  - packs:/app/public/packs
  - cache:/app/tmp/cache
  - bundle:/usr/local/bundle

services:
  ##################################################################
  # Base image
  ##################################################################

  base:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ""
        EXECJS_RUNTIME: Node
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: "false"

    image: chatwoot:development

    profiles:
      - build-only

  ##################################################################
  # Rails
  ##################################################################

  rails:
    build:
      context: .
      dockerfile: docker/dockerfiles/rails.Dockerfile

    image: chatwoot-rails:development

    env_file:
      - .env

    volumes: *app-volumes

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      RAILS_ENV: development
      VITE_DEV_SERVER_HOST: vite

    depends_on:
      - vite

    entrypoint: docker/entrypoints/rails.sh

    command:
      - bundle
      - exec
      - rails
      - server
      - -b
      - 0.0.0.0
      - -p
      - "3000"

  ##################################################################
  # Sidekiq
  ##################################################################

  sidekiq:
    build:
      context: .
      dockerfile: docker/dockerfiles/rails.Dockerfile

    image: chatwoot-rails:development

    env_file:
      - .env

    volumes: *app-volumes

    environment:
      NODE_ENV: development
      RAILS_ENV: development

    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml

  ##################################################################
  # Vite
  ##################################################################

  vite:
    build:
      context: .
      dockerfile: docker/dockerfiles/vite.Dockerfile

    image: chatwoot-vite:development

    env_file:
      - .env

    volumes: *app-volumes

    ports:
      - "3036:3036"

    environment:
      NODE_ENV: development
      RAILS_ENV: development
      VITE_DEV_SERVER_HOST: 0.0.0.0

    entrypoint: docker/entrypoints/vite.sh

    command:
      - bin/vite
      - dev

volumes:
  node_modules:
  packs:
  cache:
  bundle:
