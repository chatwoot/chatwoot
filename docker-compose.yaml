version: "3.9"

x-app-volumes: &app-volumes
  - ./:/app:delegated
  - node_modules:/app/node_modules
  - packs:/app/public/packs
  - cache:/app/tmp/cache
  - bundle:/usr/local/bundle

services:
  ##################################################################
  # Base image
  ##################################################################

  base:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ""
        EXECJS_RUNTIME: Node
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: "false"

    image: chatwoot:development

    profiles:
      - build-only

  ##################################################################
  # Rails
  ##################################################################

  rails:
    build:
      context: .
      dockerfile: docker/dockerfiles/rails.Dockerfile

    image: chatwoot-rails:development

    env_file:
      - .env

    volumes: *app-volumes

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      RAILS_ENV: development
      VITE_DEV_SERVER_HOST: vite
      # annotaterb hooks db:migrate in development and re-annotates EVERY model
      # whose schema comment drifts — spilling diffs into OSS/enterprise files the
      # fork must not touch (see docs/fork/error-log/
      # 2026-07-10-db-migrate-annotation-spill-into-oss-files.md). The fork keeps
      # annotations frozen at upstream's text; after adding a fork migration, run
      # annotaterb manually for just the fork-touched models.
      ANNOTATERB_SKIP_ON_DB_TASKS: "1"

    depends_on:
      vite:
        condition: service_started
      redis:
        condition: service_healthy

    entrypoint: docker/entrypoints/rails.sh

    command:
      - bundle
      - exec
      - rails
      - server
      - -b
      - 0.0.0.0
      - -p
      - "3000"

  ##################################################################
  # Sidekiq
  ##################################################################

  sidekiq:
    build:
      context: .
      dockerfile: docker/dockerfiles/rails.Dockerfile

    image: chatwoot-rails:development

    env_file:
      - .env

    volumes: *app-volumes

    environment:
      NODE_ENV: development
      RAILS_ENV: development

    # sidekiq has no entrypoint, so it gets no pg_isready/redis wait of its own.
    # Without this gate it boots ahead of redis and crash-loops on connect.
    depends_on:
      redis:
        condition: service_healthy

    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml

  ##################################################################
  # Vite
  ##################################################################

  vite:
    build:
      context: .
      dockerfile: docker/dockerfiles/vite.Dockerfile

    image: chatwoot-vite:development

    env_file:
      - .env

    volumes: *app-volumes

    ports:
      - "3036:3036"

    environment:
      NODE_ENV: development
      RAILS_ENV: development
      VITE_DEV_SERVER_HOST: 0.0.0.0
      # vite_ruby reads VITE_RUBY_HOST (VITE_DEV_SERVER_HOST above is only what
      # the RAILS side dials, it does not affect the bind). Without this the dev
      # server binds container-localhost (::1), the published 3036 port resets
      # every host connection, and the dashboard's assets 404 in the browser.
      VITE_RUBY_HOST: 0.0.0.0

    entrypoint: docker/entrypoints/vite.sh

    command:
      - bin/vite
      - dev

  ##################################################################
  # Redis
  ##################################################################
  #
  # Postgres stays external (Neon, via POSTGRES_* in .env), but Redis runs
  # locally here — REDIS_URL=redis://redis:6379 resolves to this service.

  redis:
    image: redis:alpine

    env_file:
      - .env

    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]

    volumes:
      - redis:/data/redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ##################################################################
  # Mailhog
  ##################################################################
  #
  # Dev SMTP sink; .env already points SMTP_PORT at 1025. Web UI on :8025.

  mailhog:
    image: mailhog/mailhog

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  node_modules:
  packs:
  cache:
  bundle:
  redis:
