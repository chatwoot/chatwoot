services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: 'Node'
        RAILS_ENV: 'development'
        RAILS_SERVE_STATIC_FILES: 'false'
    tty: true
    stdin_open: true
    image: chatwoot:development
    env_file: .env

  rails:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - vite
      - mailhog
      - sidekiq
    ports:
      - 3000:3000
    env_file: .env
    environment:
      - VITE_DEV_SERVER_HOST=vite
      - VITE_RUBY_HOST=vite
      - VITE_RUBY_PORT=3036
      - NODE_ENV=development
      - RAILS_ENV=development
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *base
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  vite:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/vite.Dockerfile
    image: chatwoot-vite:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    ports:
      - "3036:3036" # Vite dev server
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - RAILS_ENV=development
    entrypoint: docker/entrypoints/vite.sh
    command: bin/vite dev

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres:/data/postgres
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis:/data/redis
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  evolution-go:
    build:
      context: ./evolution-go
      dockerfile: Dockerfile
    ports:
      - "${EVOLUTION_GO_SERVER_PORT:-8080}:8080"
    depends_on:
      - postgres
    environment:
      - SERVER_PORT=${EVOLUTION_GO_SERVER_PORT:-8080}
      - CLIENT_NAME=${EVOLUTION_GO_CLIENT_NAME:-chatwit-evolution}
      - GLOBAL_API_KEY=${EVOLUTION_GO_GLOBAL_API_KEY:-dev-evolution-key}
      - POSTGRES_AUTH_DB=${EVOLUTION_GO_POSTGRES_AUTH_DB:-postgresql://postgres:postgres@postgres:5432/evolution_go_auth?sslmode=disable}
      - POSTGRES_USERS_DB=${EVOLUTION_GO_POSTGRES_USERS_DB:-postgresql://postgres:postgres@postgres:5432/evolution_go_users?sslmode=disable}
      - DATABASE_SAVE_MESSAGES=${EVOLUTION_GO_DATABASE_SAVE_MESSAGES:-false}
      - WEBHOOK_URL=${EVOLUTION_GO_WEBHOOK_URL:-http://rails:3000/webhooks/evolution_go}
      - QRCODE_MAX_COUNT=${EVOLUTION_GO_QRCODE_MAX_COUNT:-20}
      - WADEBUG=${EVOLUTION_GO_WADEBUG:-INFO}
      - LOGTYPE=${EVOLUTION_GO_LOGTYPE:-console}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${EVOLUTION_GO_SERVER_PORT:-8080}/server/ok | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres:
  redis:
  packs:
  node_modules:
  cache:
  bundle:
