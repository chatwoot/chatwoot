# Single stack for the whole fork: app services (rails, sidekiq, vite) plus
# local infra (redis, mailhog). Postgres is external (Neon, via POSTGRES_* in
# .env). Pinning the project name keeps `docker compose` commands addressing the
# same stack regardless of the directory it is invoked from.
name: mesh-crm

x-app-volumes: &app-volumes
  - ./:/app:delegated
  - node_modules:/app/node_modules
  - packs:/app/public/packs
  - cache:/app/tmp/cache
  - bundle:/usr/local/bundle

services:
  ##################################################################
  # Base image
  ##################################################################

  base:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ""
        EXECJS_RUNTIME: Node
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: "false"

    # Fork-owned tag. The build context is this repo, so the `custom/` overlay
    # is baked in — this is never upstream's published chatwoot image.
    image: mesh-crm:development

    profiles:
      - build-only

  ##################################################################
  # Rails
  ##################################################################

  rails:
    build:
      context: .
      dockerfile: docker/dockerfiles/rails.Dockerfile
      args:
        BASE_IMAGE: mesh-crm:development

    image: mesh-crm-rails:development

    env_file:
      - .env

    volumes: *app-volumes

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      RAILS_ENV: development
      VITE_DEV_SERVER_HOST: vite
      # vite_ruby probes VITE_RUBY_HOST (NOT VITE_DEV_SERVER_HOST, which is only
      # what Vite itself binds to). Unset, rails looks for the dev server on
      # localhost:3036 — its OWN namespace, where nothing listens — decides the
      # dev server is down, and falls back to an in-process `vite build` that
      # OOMs the container ("Ineffective mark-compacts near heap limit"). Every
      # page then 500s with "Vite Ruby can't find entrypoints/v3app.js in the
      # manifests". Point it at the vite service; vite_ruby's DevServerProxy
      # middleware forwards /vite-dev/* there, so the browser only ever talks to
      # :3000 (which is what makes this work behind the tunnel).
      VITE_RUBY_HOST: vite
      # The `vite` service owns building (see its `bin/vite build --watch`).
      # Without this, vite_ruby's autoBuild makes RAILS shell out to its own
      # `vite build` on a manifest miss — inside the rails container, on the
      # default Node heap — which OOMs after ~100s and 500s the request, while
      # the perfectly good manifest the vite service just wrote sits unused.
      # One builder, one manifest.
      VITE_RUBY_AUTO_BUILD: "false"
      # annotaterb hooks db:migrate in development and re-annotates EVERY model
      # whose schema comment drifts — spilling diffs into OSS/enterprise files the
      # fork must not touch (see docs/fork/error-log/
      # 2026-07-10-db-migrate-annotation-spill-into-oss-files.md). The fork keeps
      # annotations frozen at upstream's text; after adding a fork migration, run
      # annotaterb manually for just the fork-touched models.
      ANNOTATERB_SKIP_ON_DB_TASKS: "1"
      # rack-mini-profiler's asset endpoint 500s on every page render here
      # (/mini-profiler-resources/includes.js), adding a red herring to every
      # browser console. The fork does not use it; Procfile.tunnel already
      # disables it for the same reason.
      DISABLE_MINI_PROFILER: "true"

    depends_on:
      vite:
        condition: service_started
      redis:
        condition: service_healthy

    entrypoint: docker/entrypoints/rails.sh

    command:
      - bundle
      - exec
      - rails
      - server
      - -b
      - 0.0.0.0
      - -p
      - "3000"

  ##################################################################
  # Sidekiq
  ##################################################################

  sidekiq:
    build:
      context: .
      dockerfile: docker/dockerfiles/rails.Dockerfile
      args:
        BASE_IMAGE: mesh-crm:development

    image: mesh-crm-rails:development

    env_file:
      - .env

    volumes: *app-volumes

    environment:
      NODE_ENV: development
      RAILS_ENV: development

    # sidekiq has no entrypoint, so it gets no pg_isready/redis wait of its own.
    # Without this gate it boots ahead of redis and crash-loops on connect.
    depends_on:
      redis:
        condition: service_healthy

    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml

  ##################################################################
  # Vite
  ##################################################################

  vite:
    build:
      context: .
      dockerfile: docker/dockerfiles/vite.Dockerfile
      args:
        BASE_IMAGE: mesh-crm:development

    image: mesh-crm-vite:development

    env_file:
      - .env

    volumes: *app-volumes

    ports:
      - "3036:3036"

    environment:
      NODE_ENV: development
      RAILS_ENV: development
      VITE_DEV_SERVER_HOST: 0.0.0.0
      # vite_ruby reads VITE_RUBY_HOST (VITE_DEV_SERVER_HOST above is only what
      # the RAILS side dials, it does not affect the bind). Without this the dev
      # server binds container-localhost (::1), the published 3036 port resets
      # every host connection, and the dashboard's assets 404 in the browser.
      VITE_RUBY_HOST: 0.0.0.0
      # Vite >= 6 blocks requests whose Host header is not allow-listed. Rails
      # proxies /vite-dev/* to http://vite:3036, i.e. `Host: vite`, so without
      # this every asset 403s — Rails still serves the HTML, so you get a 200
      # page that renders a BLANK SCREEN because the SPA bundle never loads.
      # Consumed by vite.config.ts (inert when unset).
      VITE_ALLOWED_HOSTS: vite,localhost
      # Chatwoot's bundle exceeds Node's default old-space on a full build — an
      # unraised limit dies with "Ineffective mark-compacts near heap limit /
      # JavaScript heap out of memory" and leaves NO manifest, which surfaces as
      # `Vite Ruby can't find entrypoints/v3app.js` 500s on every page.
      NODE_OPTIONS: --max-old-space-size=4096

    entrypoint: docker/entrypoints/vite.sh

    # BUILD --watch, not `dev`.
    #
    # `bin/vite dev` serves the app as ~1600 UNBUNDLED ES modules (every locale x
    # every namespace is its own `?import` request). On one machine that is fine.
    # Through the Cloudflare tunnel and vite_ruby's Rails asset proxy it is not:
    # measured individual module fetches of 5s / 14s / 25s, and a first paint
    # around TWO MINUTES. The page is blank the whole time, so it reads as
    # "Chatwoot never opens" rather than "Chatwoot is slow".
    #
    # `build --watch` precompiles one bundle; Rails then serves it straight from
    # public/vite via the manifest, with no dev server in the request path at all.
    # Frontend edits still rebuild automatically — you lose hot-module reload, not
    # the reload. Since this fork is infrastructure (vendors never develop against
    # its UI), that is the right trade. Matches Procfile.tunnel.
    #
    # Switch back to `dev` only if you are actively developing Chatwoot's frontend
    # AND reaching it directly on localhost:3000.
    command:
      - bin/vite
      - build
      - --watch

  ##################################################################
  # Redis
  ##################################################################
  #
  # Postgres stays external (Neon, via POSTGRES_* in .env), but Redis runs
  # locally here — REDIS_URL=redis://redis:6379 resolves to this service.

  redis:
    image: redis:alpine

    env_file:
      - .env

    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]

    volumes:
      - redis:/data/redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ##################################################################
  # Mailhog
  ##################################################################
  #
  # Dev SMTP sink; .env already points SMTP_PORT at 1025. Web UI on :8025.

  mailhog:
    image: mailhog/mailhog

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  node_modules:
  packs:
  cache:
  bundle:
  redis:
