# Production stack for Dokploy (DEV-Johnstocker/chatwoot#1).
# Adapted from chatwoot/docker-compose.production.yaml (MIT). Differences:
# - No postgres service: Chatwoot and ai-service use Supabase (session pooler).
# - Migrations run before the Rails server starts (db:chatwoot_prepare is idempotent).
# - No published ports: Dokploy's Traefik routes the public domain to rails:3000.
# - ai-service sits behind the "ai" profile; set COMPOSE_PROFILES=ai once the
#   Chatwoot Agent Bot exists and its token/secret are in the Dokploy env.
# Every ${VAR} comes from the Dokploy environment tab; nothing secret lives here.

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.19.1
  restart: unless-stopped
  volumes:
    - storage_data:/app/storage
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: 'true'
    LOG_LEVEL: info
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set in Dokploy}
    FRONTEND_URL: ${FRONTEND_URL:?set in Dokploy}
    FORCE_SSL: 'true'
    ENABLE_ACCOUNT_SIGNUP: 'false'
    DATABASE_URL: ${CHATWOOT_DATABASE_URL:?set in Dokploy}
    REDIS_URL: redis://redis:6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set in Dokploy}
    ACTIVE_STORAGE_SERVICE: local
    # Supabase session-pooler slots are limited; keep Rails + Sidekiq small.
    RAILS_MAX_THREADS: '5'
    SIDEKIQ_CONCURRENCY: '5'
    # SAFE_FETCH_ALLOW_PRIVATE_NETWORK stays unset: it would let every URL Chatwoot
    # fetches reach redis/rails. The Agent Bot webhook uses the public HTTPS path
    # https://<FRONTEND_URL host>/webhooks/chatwoot, which Traefik routes to ai-service.
    # Email is required. Chatwoot reads these with ENV.fetch(name, default), so an
    # empty string would override its defaults (an empty From address, or a
    # sendmail fallback when SMTP_ADDRESS is blank). Missing values fail the deploy.
    MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:?set in Dokploy}
    SMTP_ADDRESS: ${SMTP_ADDRESS:?set in Dokploy}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:?set in Dokploy}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?set in Dokploy}

services:
  rails:
    <<: *chatwoot
    # The first-boot seed writes to Redis, so wait until Redis answers.
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ['sh', '-c', 'bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0']
    expose: ['3000']
    # Healthy only once migrations are done and Puma serves /api. The header
    # avoids the FORCE_SSL redirect; the image has busybox wget but no curl.
    healthcheck:
      test: ['CMD-SHELL', 'busybox wget -q -O /dev/null --header "X-Forwarded-Proto: https" http://127.0.0.1:3000/api']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  sidekiq:
    <<: *chatwoot
    # Start only after rails has finished db:chatwoot_prepare, so jobs never run
    # new code against an unmigrated schema.
    depends_on:
      redis:
        condition: service_healthy
      rails:
        condition: service_healthy
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The password goes into a private config file rather than argv, where
    # `ps` on the host could read it.
    command:
      - sh
      - -c
      - umask 077 && printf 'requirepass %s\nappendonly yes\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in Dokploy}
    healthcheck:
      # REDISCLI_AUTH keeps the password off the redis-cli command line.
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  ai-service:
    profiles: [ai]
    build: ..
    restart: unless-stopped
    depends_on: [rails]
    expose: ['8080']
    # Loopback only, for /admin over an SSH tunnel:
    #   ssh -N -L 8081:127.0.0.1:18080 llmopshostinger  →  http://localhost:8081/admin
    # Traefik exposes only /webhooks/chatwoot publicly.
    ports: ['127.0.0.1:18080:8080']
    volumes:
      - ai_data:/data
    environment:
      # Public HTTPS URL: Rails runs with FORCE_SSL, so plain http://rails:3000
      # calls get redirected to https://rails:3000, which nothing serves.
      CHATWOOT_BASE_URL: ${FRONTEND_URL:?set in Dokploy}
      # Optional: an agent account token ("AI Reader") so the bot can re-read a
      # chat after a restart or when a closed chat reopens. Bot tokens cannot.
      CHATWOOT_READER_TOKEN: ${CHATWOOT_READER_TOKEN:-}
      CHATWOOT_BOT_TOKEN: ${CHATWOOT_BOT_TOKEN:-}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-}
      ADMIN_PASSWORD: ${AI_ADMIN_PASSWORD:-}
      DATABASE_URL: ${AI_DATABASE_URL:-}
      SETTINGS_PATH: /data/settings.json
      LOG_LEVEL: info
      # Initial LLM/embeddings settings. Once someone saves /admin, the saved
      # settings in /data/settings.json win over these.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      # Same embedding model through another provider, so knowledge search
      # survives a primary outage (e.g. OpenRouter + openai/text-embedding-3-large).
      EMBED_FALLBACK_BASE_URL: ${EMBED_FALLBACK_BASE_URL:-}
      EMBED_FALLBACK_API_KEY: ${EMBED_FALLBACK_API_KEY:-}
      EMBED_FALLBACK_MODEL: ${EMBED_FALLBACK_MODEL:-}
      # Langfuse tracing (off unless all three are set). Customer text is
      # redacted; TRACE_TEXT=off sends no chat text at all.
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      TRACE_TEXT: ${TRACE_TEXT:-redacted}
      # Query rewrite on a smaller, faster model of the main provider; empty = main model.
      REWRITE_MODEL: ${REWRITE_MODEL:-}
      # Voice notes (when switched on per business) are transcribed with this model.
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}

  # /admin from a browser: Cloudflare Tunnel → https://ai-admin.johnstockeraistudio.com,
  # behind a Cloudflare Access app (owner emails only). The tunnel's ingress rules
  # live in Cloudflare and forward only ^/admin to ai-service:8080; every other path
  # gets 404. The connection is outbound, so no port opens on the VPS, and ai-service's
  # Basic Auth (ADMIN_PASSWORD) still applies behind Access.
  # Enable with COMPOSE_PROFILES=ai,admin and CF_TUNNEL_TOKEN in the Dokploy env.
  cloudflared:
    profiles: [admin]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    depends_on: [ai-service]
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}

volumes:
  storage_data:
  redis_data:
  ai_data:
