{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --text: #1d232b; --muted: #5b6573;
    --border: #d9dee5; --accent: #1f6feb; --accent-text: #ffffff;
    --ok-bg: #e8f5ec; --ok-text: #14532d; --err-bg: #fdecec; --err-text: #8a1c1c;
    --focus: #1f6feb; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1318; --card: #171c23; --text: #e6e9ee; --muted: #9aa4b2;
      --border: #2a313b; --accent: #4c8dff; --accent-text: #0b1220;
      --ok-bg: #12301f; --ok-text: #b6f0c8; --err-bg: #3a1616; --err-text: #ffc9c9;
      --focus: #7aa9ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
  }
  /* Shell: sticky sidebar menu + wide content; the sidebar becomes a top bar on phones. */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh;
    background: linear-gradient(to right, var(--card) 232px, var(--border) 232px, var(--border) 233px, transparent 233px); }
  .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 12px; }
  .brand { font-weight: 700; margin: 4px 12px 20px; }
  .brand span { color: var(--muted); font-weight: 500; }
  main { max-width: 1440px; width: 100%; padding: 28px 32px 48px; }
  .lead { max-width: 72ch; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
  .cards > .card { margin: 0; }
  .cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
  .cols2 > .card { margin: 0 0 16px; }
  .card.toolbar { padding: 14px 20px; }
  .card.toolbar label { margin-top: 0; }
  .card.toolbar .field-hint { margin-top: 4px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin: 0 0 16px;
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { font-weight: 650; font-size: 1.125rem; padding: 0; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .hint { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .badge { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.on { background: var(--ok-bg); color: var(--ok-text); border-color: transparent; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 44px;
  }
  input::placeholder { color: var(--muted); }
  .field-hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  button {
    font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
  .alert { border-radius: 8px; padding: 12px 14px; margin: 0 0 16px; overflow-wrap: anywhere; }
  .alert.ok { background: var(--ok-bg); color: var(--ok-text); }
  .alert.err { background: var(--err-bg); color: var(--err-text); white-space: pre-line; }
  .test { margin-top: 12px; margin-bottom: 0; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 600; padding: 10px 12px; min-height: 44px; display: flex; align-items: center; border-radius: 8px; white-space: nowrap; }
  nav a:hover { background: var(--bg); color: var(--text); }
  nav a[aria-current="page"] { color: var(--text); background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
  textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 160px; resize: vertical; }
  input[type="file"] { padding: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; }
  td.num { white-space: nowrap; }
  .preview { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
  .warn { color: var(--err-text); }
  button.link { border: 0; background: none; color: var(--err-text); padding: 10px 4px; min-height: 44px; }
  .inline { display: inline; }
  .page-head { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .page-head .lead { margin-bottom: 16px; }
  form.acct { display: grid; grid-template-columns: auto 7rem auto; gap: 4px 8px; align-items: center; }
  form.acct label { margin: 0; }
  form.acct .field-hint { grid-column: 1 / -1; margin: 0; }
  .span2 { grid-column: 1 / -1; }
  .grid2 textarea { min-height: 96px; }
  .biz { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .biz > .card { margin: 0; }
  .biz .side { position: sticky; top: 24px; }
  .biz .side label.check:first-of-type { margin-top: 4px; }
  button.save { width: 100%; margin-top: 20px; }
  @media (max-width: 1100px) { .biz { grid-template-columns: 1fr; } .biz .side { position: static; } }
  label.check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; margin: 12px 0 0; min-height: 44px; cursor: pointer; }
  label.check input { width: 22px; height: 22px; min-height: 0; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  label.check strong { display: block; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h2 { font-weight: 650; }
  @media (max-width: 640px) {
    .grid2 { grid-template-columns: 1fr; }
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--border); padding: 8px 0; }
    td { border: 0; padding: 4px 0; }
    td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: .85rem; }
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; background: none; }
    .sidebar { position: sticky; top: 0; z-index: 5; height: auto; padding: 0 12px; background: var(--card); border-bottom: 1px solid var(--border); }
    .brand { display: none; }
    nav { flex-direction: row; overflow-x: auto; }
    nav a { border-radius: 0; }
    nav a[aria-current="page"] { background: none; box-shadow: inset 0 -2px 0 var(--accent); }
    main { padding: 20px 16px 40px; }
  }
  @media (max-width: 480px) {
    nav a { padding: 10px 6px; font-size: .875rem; }
    .actions { justify-content: stretch; }
    .actions button, .row button { width: 100%; }
  }
</style>
{{end}}

{{define "nav"}}
<aside class="sidebar">
  <p class="brand">ai-service <span>admin</span></p>
  <nav aria-label="Settings sections">
    <a href="/admin"{{if eq . "providers"}} aria-current="page"{{end}}>AI providers</a>
    <a href="/admin/business"{{if eq . "business"}} aria-current="page"{{end}}>Business profile</a>
    <a href="/admin/knowledge"{{if eq . "knowledge"}} aria-current="page"{{end}}>Knowledge base</a>
  </nav>
</aside>
{{end}}
