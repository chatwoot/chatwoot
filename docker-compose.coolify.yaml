x-chatwoot-base: &chatwoot-base
  image: trimetra-chatwoot-production
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &chatwoot-env
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    LOG_LEVEL: ${LOG_LEVEL:-info}

    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}

    FRONTEND_URL: ${FRONTEND_URL:?}
    HELPCENTER_URL: ${HELPCENTER_URL:-}
    DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
    ASSET_CDN_HOST: ${ASSET_CDN_HOST:-}
    FORCE_SSL: ${FORCE_SSL:-true}
    ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}

    DATABASE_URL: ${DATABASE_URL:?}
    REDIS_URL: ${REDIS_URL:?}
    REDIS_SENTINELS: ${REDIS_SENTINELS:-}
    REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-}
    REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
    REDIS_OPENSSL_VERIFY_MODE: ${REDIS_OPENSSL_VERIFY_MODE:-}

    MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-}
    SMTP_DOMAIN: ${SMTP_DOMAIN:-}
    SMTP_ADDRESS: ${SMTP_ADDRESS:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
    SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
    SMTP_OPENSSL_VERIFY_MODE: ${SMTP_OPENSSL_VERIFY_MODE:-peer}
    SMTP_TLS: ${SMTP_TLS:-}
    SMTP_SSL: ${SMTP_SSL:-}
    SMTP_OPEN_TIMEOUT: ${SMTP_OPEN_TIMEOUT:-}
    SMTP_READ_TIMEOUT: ${SMTP_READ_TIMEOUT:-}

    MAILER_INBOUND_EMAIL_DOMAIN: ${MAILER_INBOUND_EMAIL_DOMAIN:-}
    EMAIL_PROCESSING_TIMEOUT_SECONDS: ${EMAIL_PROCESSING_TIMEOUT_SECONDS:-60}
    RAILS_INBOUND_EMAIL_SERVICE: ${RAILS_INBOUND_EMAIL_SERVICE:-}
    RAILS_INBOUND_EMAIL_PASSWORD: ${RAILS_INBOUND_EMAIL_PASSWORD:-}
    MAILGUN_INGRESS_SIGNING_KEY: ${MAILGUN_INGRESS_SIGNING_KEY:-}
    MANDRILL_INGRESS_API_KEY: ${MANDRILL_INGRESS_API_KEY:-}
    ACTION_MAILBOX_SES_SNS_TOPIC: ${ACTION_MAILBOX_SES_SNS_TOPIC:-}

    ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_REGION: ${AWS_REGION:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    DIRECT_UPLOADS_ENABLED: ${DIRECT_UPLOADS_ENABLED:-}

    FB_VERIFY_TOKEN: ${FB_VERIFY_TOKEN:-}
    FB_APP_SECRET: ${FB_APP_SECRET:-}
    FB_APP_ID: ${FB_APP_ID:-}
    IG_VERIFY_TOKEN: ${IG_VERIFY_TOKEN:-}
    TWITTER_APP_ID: ${TWITTER_APP_ID:-}
    TWITTER_CONSUMER_KEY: ${TWITTER_CONSUMER_KEY:-}
    TWITTER_CONSUMER_SECRET: ${TWITTER_CONSUMER_SECRET:-}
    TWITTER_ENVIRONMENT: ${TWITTER_ENVIRONMENT:-}
    SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
    SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-}
    AZURE_APP_ID: ${AZURE_APP_ID:-}
    AZURE_APP_SECRET: ${AZURE_APP_SECRET:-}

    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    ENABLE_PUSH_RELAY_SERVER: ${ENABLE_PUSH_RELAY_SERVER:-true}

    ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-}
    ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SCOUT_KEY: ${SCOUT_KEY:-}
    SCOUT_NAME: ${SCOUT_NAME:-}
    SCOUT_MONITOR: ${SCOUT_MONITOR:-}
    NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    NEW_RELIC_APPLICATION_LOGGING_ENABLED: ${NEW_RELIC_APPLICATION_LOGGING_ENABLED:-}
    DD_TRACE_AGENT_URL: ${DD_TRACE_AGENT_URL:-}
    IP_LOOKUP_API_KEY: ${IP_LOOKUP_API_KEY:-}

    ENABLE_RACK_ATTACK: ${ENABLE_RACK_ATTACK:-}
    RACK_ATTACK_LIMIT: ${RACK_ATTACK_LIMIT:-300}
    ENABLE_RACK_ATTACK_WIDGET_API: ${ENABLE_RACK_ATTACK_WIDGET_API:-}
    RACK_ATTACK_ALLOWED_IPS: ${RACK_ATTACK_ALLOWED_IPS:-}
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: ${SAFE_FETCH_ALLOW_PRIVATE_NETWORK:-false}
    CW_API_ONLY_SERVER: ${CW_API_ONLY_SERVER:-false}

    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

    SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-10}
    ENABLE_SIDEKIQ_DEQUEUE_LOGGER: ${ENABLE_SIDEKIQ_DEQUEUE_LOGGER:-false}
    REDIS_ALFRED_SIZE: ${REDIS_ALFRED_SIZE:-10}
    REDIS_VELMA_SIZE: ${REDIS_VELMA_SIZE:-10}
    REMOVE_STALE_CONTACT_INBOX_JOB_STATUS: ${REMOVE_STALE_CONTACT_INBOX_JOB_STATUS:-false}
  volumes:
    - storage_data:/app/storage

services:
  migrate:
    <<: *chatwoot-base
    exclude_from_hc: true
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    restart: "no"

  rails:
    <<: *chatwoot-base
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    expose:
      - "3000"
    restart: always

  sidekiq:
    <<: *chatwoot-base
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: always

volumes:
  storage_data:
