# Monta assets Vite compilados en host (public/vite) sin perder volúmenes del fork.
# Uso:
#   pnpm exec vite build
#   docker compose -f docker-compose.dokploy.yml -f docker-compose.dokploy.fork.yml -f docker-compose.vite-local.yml up -d --force-recreate chatwoot-rails chatwoot-sidekiq
#
# O: .\scripts\dev-vite-build.ps1

services:
  chatwoot-rails:
    volumes:
      - chatwoot-storage:/app/storage
      - ./app:/app/app
      - ./enterprise:/app/enterprise
      - ./lib:/app/lib
      - ./config:/app/config
      - ./db:/app/db
      - ./docker/entrypoints:/app/docker/entrypoints
      - ./public/vite:/app/public/vite:ro

  chatwoot-sidekiq:
    volumes:
      - chatwoot-storage:/app/storage
      - ./app:/app/app
      - ./enterprise:/app/enterprise
      - ./lib:/app/lib
      - ./config:/app/config
      - ./db:/app/db
      - ./docker/entrypoints:/app/docker/entrypoints
      - ./public/vite:/app/public/vite:ro
